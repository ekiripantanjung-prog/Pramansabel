// SAMAPTA — perkembangan kesegaran jasmani balonpas/capas
const SAMAPTA_TES=[
  {k:'pushup',lbl:'Push Up 1 Menit',unit:'kali',baik:'tinggi'},
  {k:'situp',lbl:'Sit Up 1 Menit',unit:'kali',baik:'tinggi'},
  {k:'shuttle',lbl:'Lari Shuttle Run',unit:'detik',baik:'rendah'},
];
function renderSamapta(){
  let html=`<div class="sec">💪 Perkembangan Samapta Balonpas</div>
  <div style="font-size:12px;color:var(--fg2);margin-bottom:12px">Catat hasil tes kesegaran jasmani (Push Up, Sit Up, Lari Shuttle Run) secara berkala untuk memantau perkembangan tiap Balonpas/Capas.</div>`;
  if(C.pemetaan_edit(R)){
    html+=`<button class="btn btn-primary btn-sm" style="margin-bottom:12px" onclick="modalSamapta()">+ Catat Hasil Tes</button>`;
  }
  if(D.samapta.length){
    html+=`<button class="btn btn-blue btn-sm" style="margin-bottom:12px;margin-left:8px" onclick="downloadSamaptaCSV()">📥 Rekap (Excel/CSV)</button>`;
  }
  const nama=[...new Set(D.samapta.map(s=>s.nama))];
  const calonTanpaTes=D.anggota.filter(a=>a.status==='aktif'&&['balonpas','capas'].includes(a.role)&&!nama.includes(a.nama));
  if(!nama.length) html+='<div class="alert alert-warn">Belum ada catatan hasil tes Samapta.</div>';
  nama.forEach(n=>{
    const rec=D.samapta.filter(s=>s.nama===n).sort((a,b)=>a.tgl-b.tgl);
    const awal=rec[0],akhir=rec[rec.length-1];
    html+=`<div class="item"><div class="item-head"><div class="item-title">${esc(n)}</div><span class="badge badge-info">${rec.length}x tes</span></div>
    <table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px">
      <tr style="text-align:left;color:var(--fg2)"><th style="padding:4px">Tanggal</th><th style="padding:4px">Push Up</th><th style="padding:4px">Sit Up</th><th style="padding:4px">Shuttle Run</th></tr>
      ${rec.map((s,i)=>{
        const prev=i>0?rec[i-1]:null;
        const cell=(v,prevV,baik,unit)=>{
          if(v==null)return'-';
          let ind='';
          if(prevV!=null){
            const naik=v>prevV,turun=v<prevV;
            const bagus=baik==='tinggi'?naik:turun;
            const jelek=baik==='tinggi'?turun:naik;
            if(bagus)ind=' <span style="color:var(--ok)">▲</span>';else if(jelek)ind=' <span style="color:var(--danger)">▼</span>';
          }
          return`${v}${unit==='detik'?'"':''}${ind}`;
        };
        return`<tr style="border-top:1px solid var(--border)"><td style="padding:4px">${tgl(s.tgl)}</td><td style="padding:4px">${cell(s.pushup,prev?.pushup,'tinggi','kali')}</td><td style="padding:4px">${cell(s.situp,prev?.situp,'tinggi','kali')}</td><td style="padding:4px">${cell(s.shuttle,prev?.shuttle,'rendah','detik')}</td></tr>`;
      }).join('')}
    </table>
    ${rec.length>1?`<div style="font-size:11px;color:var(--fg2);margin-top:6px">Dari tes pertama (${tgl(awal.tgl)}) ke terakhir (${tgl(akhir.tgl)}): Push Up ${awal.pushup??'-'}→${akhir.pushup??'-'}, Sit Up ${awal.situp??'-'}→${akhir.situp??'-'}, Shuttle Run ${awal.shuttle??'-'}"→${akhir.shuttle??'-'}"</div>`:''}
    ${C.pemetaan_edit(R)?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="hapusSamaptaTerakhir('${n.replace(/'/g,"\\'")}')">🗑️ Hapus Catatan Terakhir</button>`:''}
    </div>`;
  });
  if(calonTanpaTes.length&&C.pemetaan_edit(R)){
    html+=`<div class="sec">Belum punya catatan tes</div><div style="font-size:12px;color:var(--fg2)">${calonTanpaTes.map(a=>esc(a.nama)).join(', ')}</div>`;
  }
  return html;
}
function modalSamapta(){
  openModal(`<div class="modal-title">Catat Hasil Tes Samapta <button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="field"><label>Nama Anggota</label>
    <select id="sm-nama">
      <option value="">-- Pilih --</option>
      ${D.anggota.filter(a=>a.status==='aktif').map(a=>`<option value="${esc(a.nama)}">${esc(a.nama)} (${RLBL[a.role]||a.role})</option>`).join('')}
    </select>
  </div>
  <div class="field"><label>Tanggal Tes</label><input id="sm-tgl" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
  <div class="field"><label>Push Up 1 Menit (kali)</label><input id="sm-pushup" type="number" min="0" placeholder="Jumlah repetisi"></div>
  <div class="field"><label>Sit Up 1 Menit (kali)</label><input id="sm-situp" type="number" min="0" placeholder="Jumlah repetisi"></div>
  <div class="field"><label>Lari Shuttle Run (detik)</label><input id="sm-shuttle" type="number" min="0" placeholder="Waktu tempuh dalam detik"></div>
  <div class="field"><label>Catatan</label><textarea id="sm-cat" placeholder="Opsional"></textarea></div>
  <button class="btn btn-primary btn-full" onclick="simpanSamapta()">💾 Simpan</button>`);
}
function simpanSamapta(){
  const nama=document.getElementById('sm-nama').value;
  if(!nama)return toast('Pilih nama anggota');
  const num=id=>{const v=document.getElementById(id).value;return v===''?null:parseInt(v);};
  D.samapta.push({id:uid(),nama,anggotaId:D.anggota.find(a=>a.nama===nama)?.id,
    tgl:new Date(document.getElementById('sm-tgl').value||Date.now()).getTime(),
    pushup:num('sm-pushup'),situp:num('sm-situp'),shuttle:num('sm-shuttle'),
    catatan:document.getElementById('sm-cat').value.trim(),dicatatOleh:RLBL[R]});
  save();closeModal();toast('Hasil tes disimpan');renderTabKegiatan('samapta');
}
function hapusSamaptaTerakhir(nama){
  const rec=D.samapta.filter(s=>s.nama===nama).sort((a,b)=>b.tgl-a.tgl);
  if(!rec.length)return;
  if(!confirm(`Hapus catatan tes terakhir (${tgl(rec[0].tgl)}) milik ${nama}?`))return;
  tandaHapus('samapta',rec[0].id);
  save();toast('Catatan dihapus');renderTabKegiatan('samapta');
}
function downloadSamaptaCSV(){
  let csv='Tanggal,Nama,Push Up (kali),Sit Up (kali),Shuttle Run (detik),Catatan,Dicatat Oleh\n';
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  D.samapta.slice().sort((a,b)=>a.tgl-b.tgl).forEach(s=>{
    csv+=[q(tgl(s.tgl)),q(s.nama),q(s.pushup??''),q(s.situp??''),q(s.shuttle??''),q(s.catatan||''),q(s.dicatatOleh||'')].join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`rekap_samapta_balonpas_${new Date().toISOString().split('T')[0]}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('📥 Rekap Samapta diunduh');
}

function copyWA(teks){
  try{
    navigator.clipboard.writeText(teks).then(()=>toast('Disalin ke clipboard! Paste ke WA grup')).catch(()=>{selectTeks(teks);});
  }catch(e){toast('Salin manual dari text di bawah');}
}
function selectTeks(teks){
  const ta=document.createElement('textarea');ta.value=teks;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Disalin!');
}
function shareWA(teks){
  if(navigator.share){navigator.share({text:teks}).catch(()=>copyWA(teks));}
  else copyWA(teks);
}
function tambahInfo(){
  const judul=document.getElementById('inf-judul').value.trim();

  D.info.push({id:uid(),kat:document.getElementById('inf-kat').value.trim()||'Umum',judul,isi:document.getElementById('inf-isi').value.trim()});
  save();toast('Materi ditambahkan');renderTabKegiatan('share');
}

// ── Rekap & Statistik Hasil Simulasi (Pembina/Pelatih) ──
let _statSimPaketId='semua';
function bukaStatistikSimulasi(){
  document.getElementById('tab-kegiatan').innerHTML=renderStatistikSimulasi();
  window.scrollTo(0,0);
}
function pilihPaketStatistik(v){
  _statSimPaketId=v;
  document.getElementById('tab-kegiatan').innerHTML=renderStatistikSimulasi();
  window.scrollTo(0,0);
}
function hasilTerfilterStatistik(){
  return _statSimPaketId==='semua'?D.hasilSimulasi.slice():D.hasilSimulasi.filter(h=>h.paketId===_statSimPaketId);
}
function renderStatistikSimulasi(){
  if(!['pembina','pelatih'].includes(R))return'<div class="alert alert-warn">Hanya Pembina/Pelatih yang dapat melihat rekap ini.</div>';
  const hasil=hasilTerfilterStatistik();
  const paketOpts=`<option value="semua"${_statSimPaketId==='semua'?' selected':''}>— Semua Paket —</option>`+
    D.paketSoal.map(p=>`<option value="${p.id}"${_statSimPaketId===p.id?' selected':''}>${esc(p.nama)}</option>`).join('');

  let html=`<div class="sec">📊 Rekap & Statistik Hasil Simulasi</div>
  <button class="btn btn-ghost btn-sm" style="margin-bottom:10px" onclick="renderTabKegiatan('simulasi')">← Kembali ke Simulasi</button>
  <div class="field"><label>Filter Paket</label><select onchange="pilihPaketStatistik(this.value)">${paketOpts}</select></div>`;

  if(!hasil.length){
    html+='<div class="alert alert-warn">Belum ada hasil pengerjaan untuk filter ini.</div>';
    return html;
  }

  // ── Statistik ringkasan ──
  const n=hasil.length;
  const avg=arr=>arr.reduce((s,v)=>s+v,0)/arr.length;
  const skorArr=hasil.map(h=>h.skorTotal);
  const avgSkor=Math.round(avg(skorArr)*10)/10;
  const avgTiuPct=Math.round(avg(hasil.map(h=>h.totalTiu?h.tiuBenar/h.totalTiu*100:0))*10)/10;
  const avgTwkPct=Math.round(avg(hasil.map(h=>h.totalTwk?h.twkBenar/h.totalTwk*100:0))*10)/10;
  const tertinggi=hasil.slice().sort((a,b)=>b.skorTotal-a.skorTotal)[0];
  const terendah=hasil.slice().sort((a,b)=>a.skorTotal-b.skorTotal)[0];

  html+=`<div class="card" style="margin-top:10px">
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div><div style="font-size:12px;color:var(--fg2)">Jumlah Peserta</div><div style="font-size:20px;font-weight:700">${n}</div></div>
      <div><div style="font-size:12px;color:var(--fg2)">Rata-rata Skor</div><div style="font-size:20px;font-weight:700;color:var(--accent)">${avgSkor}</div></div>
      <div><div style="font-size:12px;color:var(--fg2)">Rata-rata TIU</div><div style="font-size:20px;font-weight:700">${avgTiuPct}%</div></div>
      <div><div style="font-size:12px;color:var(--fg2)">Rata-rata TWK</div><div style="font-size:20px;font-weight:700">${avgTwkPct}%</div></div>
    </div>
    <div style="margin-top:10px;font-size:13px">
      🏆 Skor Tertinggi: <b>${esc(tertinggi.nama)}</b> (${tertinggi.skorTotal})<br>
      ⚠️ Skor Terendah: <b>${esc(terendah.nama)}</b> (${terendah.skorTotal})
    </div>
  </div>`;

  // ── Distribusi skor ──
  const bucket=[0,0,0,0,0]; // 0-20,21-40,41-60,61-80,81-100
  skorArr.forEach(s=>{const i=Math.min(4,Math.floor(s/20.0001));bucket[i]++;});
  const bucketLbl=['0-20','21-40','41-60','61-80','81-100'];
  html+=`<div class="sec" style="font-size:13px;margin-top:12px">📈 Distribusi Skor</div><div class="card">`;
  bucket.forEach((c,i)=>{
    const pct=n?Math.round(c/n*100):0;
    html+=`<div style="margin-top:6px"><div class="gauge-row"><div class="gauge-label" style="min-width:52px">${bucketLbl[i]}</div><div class="gauge-bar"><div class="gauge-fill" style="width:${pct}%;background:var(--accent)"></div></div><div class="gauge-val">${c}</div></div></div>`;
  });
  html+=`</div>`;

  // ── Soal tersulit (persentase benar terendah) — hanya untuk paket spesifik ──
  if(_statSimPaketId!=='semua'){
    const p=D.paketSoal.find(x=>x.id===_statSimPaketId);
    if(p){
      const analisis=[];
      ['tiu','twk'].forEach(bagian=>{
        (p[bagian]||[]).forEach((s,i)=>{
          const jawabKey=bagian==='tiu'?'jawabanTiu':'jawabanTwk';
          const dijawabOleh=hasil.filter(h=>h[jawabKey]&&h[jawabKey][i]!=null);
          const benar=dijawabOleh.filter(h=>h[jawabKey][i]===s.jawaban).length;
          const pct=dijawabOleh.length?Math.round(benar/dijawabOleh.length*100):null;
          analisis.push({bagian:bagian.toUpperCase(),no:i+1,teks:s.teks,pct,dijawab:dijawabOleh.length});
        });
      });
      const terjawab=analisis.filter(a=>a.pct!==null).sort((a,b)=>a.pct-b.pct).slice(0,10);
      if(terjawab.length){
        html+=`<div class="sec" style="font-size:13px;margin-top:12px">🧩 10 Soal Tersulit (persentase benar terendah)</div>`;
        terjawab.forEach(a=>{
          html+=`<div class="item"><div style="font-size:12px;color:var(--fg2)">${a.bagian} #${a.no} · dijawab ${a.dijawab} orang</div>
          <div style="font-size:13px;margin-top:2px">${esc(a.teks)}</div>
          <div style="margin-top:4px"><span class="badge ${a.pct<40?'badge-danger':(a.pct<70?'badge-warn':'badge-ok')}">${a.pct}% benar</span></div></div>`;
        });
      }
    }
  }

  // ── Tabel lengkap seluruh peserta ──
  html+=`<div class="sec" style="font-size:13px;margin-top:12px">📋 Data Lengkap Peserta</div>
  <button class="btn btn-blue btn-sm" style="margin-bottom:10px" onclick="downloadHasilSimulasiCSV()">📥 Download CSV</button>`;
  hasil.slice().sort((a,b)=>b.skorTotal-a.skorTotal).forEach(h=>{
    const paket=D.paketSoal.find(p=>p.id===h.paketId);
    const izinAktif=adaIzinUlang(h.nama,h.paketId);
    html+=`<div class="item">
      <div class="item-title">${esc(h.nama)} <span style="font-weight:400;color:var(--fg2);font-size:12px">(${esc(RLBL[h.role]||h.role)})</span></div>
      <div style="font-size:12px;color:var(--fg2)">${esc(paket?paket.nama:'Paket dihapus')} · ${jamTgl(h.waktu)}</div>
      <div style="margin-top:4px;font-size:13px">TIU: ${h.tiuBenar}/${h.totalTiu} · TWK: ${h.twkBenar}/${h.totalTwk} · <b>Skor: ${h.skorTotal}/100</b></div>
      ${paket?(izinAktif?`<span class="badge badge-ok" style="margin-top:6px;display:inline-block">🔓 Sudah diizinkan mengerjakan ulang</span>`:`<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="izinkanUlangSimulasi('${esc(h.nama).replace(/'/g,"\\'")}','${h.paketId}')">🔓 Izinkan Mengerjakan Ulang</button>`):''}
    </div>`;
  });
  return html;
}
function downloadHasilSimulasiCSV(){
  const hasil=hasilTerfilterStatistik().slice().sort((a,b)=>b.skorTotal-a.skorTotal);
  let csv='Nama,Peran,Paket,Tanggal,TIU Benar,TIU Total,TWK Benar,TWK Total,Skor Total\n';
  hasil.forEach(h=>{
    const paket=D.paketSoal.find(p=>p.id===h.paketId);
    const row=[h.nama,RLBL[h.role]||h.role,paket?paket.nama:'Paket dihapus',jamTgl(h.waktu),h.tiuBenar,h.totalTiu,h.twkBenar,h.totalTwk,h.skorTotal];
    csv+=row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const namaPaket=_statSimPaketId==='semua'?'semua_paket':(D.paketSoal.find(p=>p.id===_statSimPaketId)?.nama||'paket').replace(/[^a-z0-9]+/gi,'_');
  a.href=url;a.download=`hasil_simulasi_${namaPaket}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('📥 Rekap hasil simulasi diunduh');
}

// ── Kelola paket soal (buat/edit/hapus) ──
let _paketEditId=null,_paketSoal={tiu:[],twk:[]};
function soalKosong(){return{teks:'',opsi:['','','','',''],jawaban:0}}
// Parser impor cepat: format teks bebas —
// "1. Teks soal" lalu baris opsi "A. teks", kunci jawaban ditandai awalan * (misal "*B. teks").
// Mendukung 4 atau 5 opsi (A-E); opsi yang tidak ada dibiarkan kosong.
function parseSoalTeks(teks){
  const HURUF='ABCDE';
  const baris=(teks||'').split(/\r?\n/);
  const soal=[];
  let cur=null;
  baris.forEach(ln=>{
    const l=ln.trim();
    if(!l)return;
    const mSoal=l.match(/^\*?\s*\(?\d+[\.\)]\s*(.*)$/);
    const mOpsi=l.match(/^(\*?)\s*([A-Ea-e])[\.\)]\s*(.*)$/);
    if(mOpsi && HURUF.includes(mOpsi[2].toUpperCase()) && cur){
      const oi=HURUF.indexOf(mOpsi[2].toUpperCase());
      cur.opsi[oi]=mOpsi[3].trim();
      if(mOpsi[1]==='*')cur.jawaban=oi;
      return;
    }
    if(mSoal){
      cur=soalKosong();
      cur.teks=mSoal[1].trim();
      soal.push(cur);
      return;
    }
    // baris lanjutan (catatan dsb) — gabungkan ke teks soal kalau belum ada opsi tercatat
    if(cur && cur.opsi.every(o=>!o)){
      cur.teks=(cur.teks+' '+l).trim();
    }
  });
  return soal.filter(s=>s.teks);
}
function imporSoalDariTeks(bagian){
  const ta=document.getElementById('ps-impor-'+bagian);
  const teks=ta?ta.value:'';
  if(!teks||!teks.trim())return toast('Tempel teks soal dulu di kotak impor');
  const hasil=parseSoalTeks(teks);
  if(!hasil.length)return toast('Tidak ada soal yang terbaca — cek lagi formatnya (nomor lalu A./B./C./dst, kunci jawaban diberi tanda *)');
  _paketSoal.tiu=ambilSoalPaketDariForm('tiu');
  _paketSoal.twk=ambilSoalPaketDariForm('twk');
  const sudahAda=_paketSoal[bagian].some(s=>s.teks);
  if(sudahAda && !confirm(`Impor akan MENGGANTI semua soal ${bagian.toUpperCase()} yang sudah ada di form ini dengan ${hasil.length} soal baru. Lanjutkan?`))return;
  _paketSoal[bagian]=hasil;
  bukaModalPaket(ambilHeaderPaketDariForm());
  toast(`✅ ${hasil.length} soal ${bagian.toUpperCase()} berhasil diimpor`);
}

// ── Pembatasan: 1 anggota hanya boleh mengerjakan 1 paket soal SEKALI,
// kecuali Pembina/Pelatih memberi izin ulang khusus untuk orang tsb. ──
function sudahPernahKerjakan(nama,paketId){
  return D.hasilSimulasi.some(h=>h.paketId===paketId&&h.nama===nama);
}
function adaIzinUlang(nama,paketId){
  return D.izinUlangSimulasi.find(x=>x.paketId===paketId&&x.nama===nama&&!x.terpakai)||null;
}
function izinkanUlangSimulasi(nama,paketId){
  if(!confirm(`Izinkan ${nama} mengerjakan ulang paket ini sekali lagi?`))return;
  D.izinUlangSimulasi.push({id:uid(),paketId,nama,diizinkanOleh:RLBL[R]||R,waktu:Date.now(),terpakai:false});
  save();toast('🔓 '+nama+' diizinkan mengerjakan ulang');
  if(typeof renderStatistikSimulasi==='function'&&document.getElementById('tab-kegiatan'))document.getElementById('tab-kegiatan').innerHTML=renderStatistikSimulasi();
}
let _simTimerId=null,_simSisaDetik=0;
function bukaSoalSimulasi(paketId){
  const nama=document.getElementById('sim-nama').value.trim();
  if(!nama)return toast('Nama harus diisi');
  const p=D.paketSoal.find(x=>x.id===paketId);if(!p)return;
  if(sudahPernahKerjakan(nama,paketId)){
    const izin=adaIzinUlang(nama,paketId);
    if(!izin)return toast('⛔ '+nama+' sudah pernah mengerjakan paket ini. Minta izin ke Pembina/Pelatih untuk mengerjakan ulang.');
    izin.terpakai=true;save();
    toast('🔓 Izin mengerjakan ulang dipakai — selamat mengerjakan lagi!');
  }
  _simPaketId=paketId;_simNama=nama;
  _simJawabanTiu=new Array((p.tiu||[]).length).fill(null);
  _simJawabanTwk=new Array((p.twk||[]).length).fill(null);
  closeModal();
  document.getElementById('tab-kegiatan').innerHTML=renderSoalSimulasi(p);
  window.scrollTo(0,0);
  mulaiTimerSimulasi(p.durasiMenit||40);
}
function mulaiTimerSimulasi(menit){
  clearInterval(_simTimerId);
  _simSisaDetik=Math.max(1,menit)*60;
  tampilkanTimerSimulasi();
  _simTimerId=setInterval(()=>{
    _simSisaDetik--;
    if(_simSisaDetik<=0){
      clearInterval(_simTimerId);
      tampilkanTimerSimulasi();
      toast('⏰ Waktu habis! Jawaban otomatis dikumpulkan.');
      selesaiSimulasi(true);
      return;
    }
    tampilkanTimerSimulasi();
  },1000);
}
function tampilkanTimerSimulasi(){
  const el=document.getElementById('sim-timer');if(!el)return;
  const m=Math.floor(_simSisaDetik/60),s=_simSisaDetik%60;
  const teks='⏱️ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.textContent=teks;
  el.style.color=_simSisaDetik<=300?'#ef4444':(_simSisaDetik<=600?'var(--warn)':'var(--accent)');
}
function batalkanSimulasi(){
  clearInterval(_simTimerId);
  if(!confirm('Batalkan pengerjaan simulasi ini? Jawaban yang sudah diisi tidak akan disimpan.'))return;
  renderTabKegiatan('simulasi');
}
function renderSoalSimulasi(p){
  const huruf=['A','B','C','D','E'];
  let html=`<div class="sec">📝 ${esc(p.nama)}</div>
  <div class="alert alert-warn" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <span>Jawab semua soal, lalu tap "Selesai Mengerjakan" di bagian paling bawah.</span>
    <b id="sim-timer" style="font-size:16px;white-space:nowrap">⏱️ --:--</b>
  </div>`;
  if((p.tiu||[]).length){
    html+=`<div class="sec" style="margin-top:12px">🧠 TIU</div>`;
    p.tiu.forEach((s,i)=>{
      html+=`<div class="item"><b>${i+1}. ${esc(s.teks)}</b>
      ${(s.opsi||[]).map((o,oi)=>o?`<div style="margin-top:4px"><label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="radio" name="sim-tiu-${i}" onchange="_simJawabanTiu[${i}]=${oi}"> ${huruf[oi]}. ${esc(o)}</label></div>`:'').join('')}
      </div>`;
    });
  }
  if((p.twk||[]).length){
    html+=`<div class="sec" style="margin-top:12px">🇮🇩 TWK</div>`;
    p.twk.forEach((s,i)=>{
      html+=`<div class="item"><b>${i+1}. ${esc(s.teks)}</b>
      ${(s.opsi||[]).map((o,oi)=>o?`<div style="margin-top:4px"><label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="radio" name="sim-twk-${i}" onchange="_simJawabanTwk[${i}]=${oi}"> ${huruf[oi]}. ${esc(o)}</label></div>`:'').join('')}
      </div>`;
    });
  }
  html+=`<button class="btn btn-primary btn-full" style="margin-top:14px" onclick="selesaiSimulasi()">✅ Selesai Mengerjakan</button>
  <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="batalkanSimulasi()">✕ Batalkan</button>`;
  return html;
}
function selesaiSimulasi(paksa){
  const p=D.paketSoal.find(x=>x.id===_simPaketId);if(!p)return;
  const belum=_simJawabanTiu.filter(j=>j===null).length+_simJawabanTwk.filter(j=>j===null).length;
  if(!paksa && belum>0 && !confirm(`Masih ada ${belum} soal belum dijawab. Tetap selesaikan?`))return;
  clearInterval(_simTimerId);
  const tiuBenar=(p.tiu||[]).filter((s,i)=>_simJawabanTiu[i]===s.jawaban).length;
  const twkBenar=(p.twk||[]).filter((s,i)=>_simJawabanTwk[i]===s.jawaban).length;
  const totalSoal=(p.tiu||[]).length+(p.twk||[]).length;
  const totalBenar=tiuBenar+twkBenar;
  const skorTotal=totalSoal?Math.round((totalBenar/totalSoal)*100):0;
  const hasil={id:uid(),paketId:p.id,nama:_simNama,role:R,tiuBenar,twkBenar,totalTiu:(p.tiu||[]).length,totalTwk:(p.twk||[]).length,skorTotal,waktu:Date.now(),jawabanTiu:[..._simJawabanTiu],jawabanTwk:[..._simJawabanTwk]};
  D.hasilSimulasi.push(hasil);
  save();
  document.getElementById('tab-kegiatan').innerHTML=renderHasilSimulasi(p,hasil);
  window.scrollTo(0,0);
}
function renderHasilSimulasi(p,hasil){
  const huruf=['A','B','C','D','E'];
  let html=`<div class="sec">✅ Hasil Simulasi — ${esc(hasil.nama)}</div>
  <div class="item">
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:4px">
      <div><div style="font-size:12px;color:var(--fg2)">TIU</div><div style="font-size:20px;font-weight:700">${hasil.tiuBenar}/${hasil.totalTiu}</div></div>
      <div><div style="font-size:12px;color:var(--fg2)">TWK</div><div style="font-size:20px;font-weight:700">${hasil.twkBenar}/${hasil.totalTwk}</div></div>
      <div><div style="font-size:12px;color:var(--fg2)">Skor Total</div><div style="font-size:20px;font-weight:700;color:var(--accent)">${hasil.skorTotal}/100</div></div>
    </div>
  </div>
  <div class="sec" style="margin-top:12px">🔑 Kunci Jawaban & Koreksi</div>`;
  const bagian=[['TIU',p.tiu||[],hasil.jawabanTiu],['TWK',p.twk||[],hasil.jawabanTwk]];
  bagian.forEach(([label,soalList,jawabanUser])=>{
    if(!soalList.length)return;
    html+=`<div style="font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 6px">${label}</div>`;
    soalList.forEach((s,i)=>{
      const jwbUser=jawabanUser[i];
      const benar=jwbUser===s.jawaban;
      html+=`<div class="item" style="border-left:4px solid ${benar?'#22c55e':'#ef4444'}">
        <b>${i+1}. ${esc(s.teks)}</b>
        ${(s.opsi||[]).map((o,oi)=>o?`<div style="font-size:13px;margin-top:3px;${oi===s.jawaban?'color:#22c55e;font-weight:700':(oi===jwbUser?'color:#ef4444':'')}">${huruf[oi]}. ${esc(o)}${oi===s.jawaban?' ✓ (Kunci)':''}${oi===jwbUser&&oi!==s.jawaban?' ✗ (Jawaban Anda)':''}</div>`:'').join('')}
        ${(jwbUser===null||jwbUser===undefined)?'<div style="font-size:12px;color:var(--fg3);margin-top:3px">Tidak dijawab</div>':''}
      </div>`;
    });
  });
  html+=`<button class="btn btn-primary btn-full" style="margin-top:14px" onclick="renderTabKegiatan('simulasi')">← Kembali ke Daftar Simulasi</button>`;
  return html;
}

function renderRekapPembina(){
  const now=Date.now();
  const bln=new Date().getMonth();const thn=new Date().getFullYear();
  // Hitung data
  const anggotaAktif=D.anggota.filter(a=>a.status==='aktif');

  const balonpas=anggotaAktif.filter(a=>a.role==='balonpas'||a.role==='capas');
  // Absensi bulan ini
  const absBln=D.absensi.filter(a=>{const d=new Date(a.tgl);return d.getMonth()===bln&&d.getFullYear()===thn;});
  const totalSesi=absBln.length;
  const rataHadir=totalSesi?Math.round(absBln.reduce((s,a)=>{const h=Object.values(a.data||{}).filter(v=>v==='H').length;const t=Object.values(a.data||{}).length;return s+(t?h/t:0);},0)/totalSesi*100):0;
  // Pelanggaran bulan ini
  const pelBln=D.pelanggaran.filter(p=>{const d=new Date(p.tgl);return d.getMonth()===bln&&d.getFullYear()===thn;});
  const pelResmi=pelBln.filter(p=>p.status!=='aduan');
  const aduanPending=D.pelanggaran.filter(p=>p.status==='aduan');
  // Keuangan

  const keluar=D.keuangan.filter(k=>k.jenis==='keluar').reduce((s,k)=>s+k.jumlah,0);
  const saldo=masuk-keluar;
  // Proker

  const prokerPending=D.proker.filter(p=>p.status==='pending').length;

    .map(p=>{const ss=Object.values(p.scores);const avg=ss.reduce((a,s)=>a+(s.pb+s.fisik+s.mental+s.disiplin+s.kepemimpinan+s.komunikasi)/6,0)/ss.length;return{nama:p.nama,avg:Math.round(avg*10)/10};})
    .sort((a,b)=>b.avg-a.avg).slice(0,5);

      <div class="stat-box"><div class="n" style="color:var(--gold)">${balonpas.length}</div><div class="l">Calon PPS</div></div>
      <div class="stat-box"><div class="n" style="color:var(--warn)">${aduanPending.length}</div><div class="l">Aduan Pending</div></div>
    </div>

    <div class="sec">📅 KEHADIRAN BULAN INI</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:14px;font-weight:600">${totalSesi} Sesi Latihan</span>
        <span class="badge ${rataHadir>=80?'badge-ok':rataHadir>=60?'badge-warn':'badge-danger'}">${rataHadir}% Rata Hadir</span>
      </div>
      <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden">
        <div style="background:${rataHadir>=80?'var(--ok)':rataHadir>=60?'var(--warn)':'var(--danger)'};height:100%;width:${rataHadir}%;transition:.5s"></div>
      </div>
      ${absBln.length?`<div style="margin-top:12px">${absBln.slice(-3).reverse().map(a=>{
        const h=Object.values(a.data||{}).filter(v=>v==='H').length;
        const t=Object.values(a.data||{}).length;
        return`<div class="item"><div class="item-title">${a.sesi} — ${tgl(a.tgl)}</div><div class="item-sub">${h}/${t} hadir</div></div>`;
      }).join('')}</div>`:'<div style="font-size:13px;color:var(--fg3);margin-top:8px">Belum ada absensi bulan ini</div>'}
    </div>

    <div class="sec">⚖️ PELANGGARAN BULAN INI</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">

      </div>
      ${aduanPending.length?`<div style="background:rgba(201,117,5,.1);border:1px solid var(--warn);border-radius:8px;padding:10px;margin-bottom:10px">
        <div style="font-size:12px;font-weight:700;color:var(--warn);margin-bottom:8px">⚠️ ADUAN PERLU DIVERIFIKASI</div>
        ${aduanPending.map(p=>`<div class="item"><div class="item-title">${esc(p.nama)}</div><div class="item-sub">${esc(p.jenis)} · dilaporkan oleh ${esc(p.dilaporkanOleh||'-')}</div></div>`).join('')}

      </div>`:''}
      ${perluPerhatian.length?`<div style="background:rgba(191,42,32,.08);border-radius:8px;padding:10px">

      </div>`:'<div style="font-size:13px;color:var(--ok)">✓ Tidak ada anggota melewati batas</div>'}
    </div>

    <div class="sec">💰 KEUANGAN</div>

      <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-box"><div class="n" style="color:var(--ok);font-size:16px">${(masuk/1000).toFixed(0)}K</div><div class="l">Masuk</div></div>
        <div class="stat-box"><div class="n" style="color:var(--danger);font-size:16px">${(keluar/1000).toFixed(0)}K</div><div class="l">Keluar</div></div>
        <div class="stat-box"><div class="n" style="color:${saldo>=0?'var(--ok)':'var(--danger)'};font-size:16px">${(saldo/1000).toFixed(0)}K</div><div class="l">Saldo</div></div>

        <div class="stat-box" style="flex:1"><div class="n" style="color:var(--warn)">${prokerPending}</div><div class="l">Pending ACC</div></div>

function tabLaporan(t,btn){
  document.querySelectorAll('#s-laporan .tab').forEach(b=>b.classList.remove('on'));

}

  const el=document.getElementById('tab-laporan');

  else if(t==='ringkasan') el.innerHTML=renderLaporanKinerja();

}

function parseTglAny(d){
  if(d===null||d===undefined)return null;
  if(typeof d==='number')return new Date(d);
  if(d instanceof Date)return d;
  if(typeof d==='string'){
    const m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m)return new Date(+m[3],+m[2]-1,+m[1]);
    const t=new Date(d);
    if(!isNaN(t.getTime()))return t;
  }
  return null;
}
function hitungRentangPeriode(jenis,ref){
  let start,end;
  if(jenis==='minggu'){
    const day=ref.getDay();
    const diffToMonday=(day===0?-6:1-day);
    start=new Date(ref);start.setDate(ref.getDate()+diffToMonday);start.setHours(0,0,0,0);
    end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
  } else if(jenis==='bulan'){
    start=new Date(ref.getFullYear(),ref.getMonth(),1,0,0,0,0);
    end=new Date(ref.getFullYear(),ref.getMonth()+1,0,23,59,59,999);
  } else if(jenis==='semester'){
    if(ref.getMonth()<6){start=new Date(ref.getFullYear(),0,1,0,0,0,0);end=new Date(ref.getFullYear(),5,30,23,59,59,999);}
    else{start=new Date(ref.getFullYear(),6,1,0,0,0,0);end=new Date(ref.getFullYear(),11,31,23,59,59,999);}
  } else {
    start=new Date(ref.getFullYear(),0,1,0,0,0,0);end=new Date(ref.getFullYear(),11,31,23,59,59,999);
  }
  return {start,end};
}
function rekapAbsensi(start,end){
  const counts={};
  D.absensi.forEach(r=>{
    const d=parseTglAny(r.tgl);if(!d||d<start||d>end)return;
    if(!counts[r.anggotaId])counts[r.anggotaId]={hadir:0,izin:0,sakit:0,alfa:0};
    if(counts[r.anggotaId][r.status]!==undefined)counts[r.anggotaId][r.status]++;
  });
  const rows=[];
  D.anggota.filter(a=>['pps_aktif','pps_senior','balonpas','capas'].includes(a.role)).sort((a,b)=>a.nama.localeCompare(b.nama,'id',{sensitivity:'base'})).forEach(a=>{
    const c=counts[a.id];if(!c)return;
    rows.push([a.nama,a.kelas||'-',RLBL[a.role]||a.role,c.hadir,c.izin,c.sakit,c.alfa,c.hadir+c.izin+c.sakit+c.alfa]);
  });
  return {judul:'Rekap Absensi',kolom:['Nama','Kelas','Peran','Hadir','Izin','Sakit','Alfa','Total Sesi'],rows,
    ringkasan:rows.length?[{label:'Jumlah Anggota Tercatat',value:rows.length}]:[]};
}
function rekapPelanggaran(start,end){
  const list=D.pelanggaran.filter(p=>{const d=parseTglAny(p.tgl);return d&&d>=start&&d<=end;}).sort((a,b)=>(a.tgl||0)-(b.tgl||0));
  const rows=list.map(p=>[tgl(p.tgl),p.nama,p.jenis,p.poin,p.tindakan||'-',p.status]);
  const totalPoin=list.reduce((s,p)=>s+(p.poin||0),0);
  return {judul:'Rekap Pelanggaran',kolom:['Tanggal','Nama','Jenis','Poin','Tindakan','Status'],rows,
    ringkasan:[{label:'Jumlah Kejadian',value:list.length},{label:'Total Poin',value:totalPoin}]};
}
function rekapKeuangan(start,end){
  const list=D.kas.filter(k=>{const d=parseTglAny(k.tgl);return d&&d>=start&&d<=end;}).sort((a,b)=>(a.tgl||0)-(b.tgl||0));
  const rows=list.map(k=>[tgl(k.tgl),k.ket,k.kategori||'Lainnya',k.jenis==='masuk'?'Pemasukan':'Pengeluaran',fmtRp(k.nominal),k.dicatatOleh||'-']);
  const masuk=list.filter(k=>k.jenis==='masuk').reduce((s,k)=>s+k.nominal,0);
  const keluar=list.filter(k=>k.jenis==='keluar').reduce((s,k)=>s+k.nominal,0);
  return {judul:'Rekap Keuangan',kolom:['Tanggal','Keterangan','Kategori','Jenis','Jumlah','Dicatat Oleh'],rows,
    ringkasan:[{label:'Total Pemasukan Periode Ini',value:fmtRp(masuk)},{label:'Total Pengeluaran Periode Ini',value:fmtRp(keluar)},{label:'Selisih Periode Ini',value:fmtRp(masuk-keluar)}]};
}
function kumpulkanRekapData(jenis,start,end){
  if(jenis==='absensi')return[rekapAbsensi(start,end)];
  if(jenis==='pelanggaran')return[rekapPelanggaran(start,end)];
  if(jenis==='keuangan')return[rekapKeuangan(start,end)];
  return[rekapAbsensi(start,end),rekapPelanggaran(start,end),rekapKeuangan(start,end)];
}
function labelJenisRekap(j){return j==='absensi'?'Absensi':j==='pelanggaran'?'Pelanggaran':j==='keuangan'?'Keuangan':'Gabungan';}
function fileDateLabel(d){return new Date(d).toISOString().split('T')[0];}
function tampilkanRekapPeriode(){
  const jenis=document.getElementById('rk-jenis').value;
  const periode=document.getElementById('rk-periode').value;
  const tglVal=document.getElementById('rk-tgl').value;
  if(!tglVal)return toast('Pilih tanggal acuan dulu');
  const ref=new Date(tglVal+'T00:00:00');
  if(isNaN(ref.getTime()))return toast('Tanggal acuan tidak valid');
  const{start,end}=hitungRentangPeriode(periode,ref);
  const data=kumpulkanRekapData(jenis,start,end);
  window._rekapTerakhir={jenis,periode,start,end,data};
  document.getElementById('rk-hasil').innerHTML=renderHasilRekap(data,start,end);
}
function renderHasilRekap(sections,start,end){
  let html=`<div class="card" style="margin-top:12px">
    <div style="font-size:12px;color:var(--fg2);margin-bottom:10px">Periode: <strong>${tgl(start)} – ${tgl(end)}</strong></div>`;
  sections.forEach(sec=>{
    html+=`<div class="sec">${esc(sec.judul)}</div>`;
    if(!sec.rows.length){
      html+='<div class="alert alert-warn" style="font-size:12px">Tidak ada data pada periode ini.</div>';
    } else {
      html+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr>${sec.kolom.map(k=>`<th style="text-align:left;padding:6px;border-bottom:2px solid var(--border)">${esc(k)}</th>`).join('')}</tr></thead>
        <tbody>${sec.rows.map(r=>`<tr>${r.map(c=>`<td style="padding:6px;border-bottom:1px solid var(--border)">${esc(String(c))}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    }
    if(sec.ringkasan&&sec.ringkasan.length){
      html+=`<div style="margin-top:6px;font-size:12px;color:var(--fg2)">${sec.ringkasan.map(r=>`<strong>${esc(r.label)}:</strong> ${esc(String(r.value))}`).join(' &nbsp;·&nbsp; ')}</div>`;
    }
  });
  html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
    <button class="btn btn-danger btn-sm" onclick="exportRekapPDF()">📄 Unduh PDF</button>
    <button class="btn btn-ok btn-sm" onclick="exportRekapExcel()">📊 Unduh Excel</button>
    <button class="btn btn-blue btn-sm" onclick="exportRekapWord()">📝 Unduh Word</button>
  </div></div>`;
  return html;
}
function _bodyRekapHTML(Rk){
  let body=`<h2 style="margin:0 0 4px;font-family:Arial,sans-serif">Rekap ${labelJenisRekap(Rk.jenis)}</h2>
  <div style="font-size:12px;color:#555;font-family:Arial,sans-serif;margin-bottom:4px">PASMANSABEL — PASKIBRA MAN 1 Belitung</div>
  <div style="font-size:12px;color:#555;font-family:Arial,sans-serif;margin-bottom:16px">Periode: ${tgl(Rk.start)} – ${tgl(Rk.end)} &nbsp;·&nbsp; Dicetak: ${tgl(Date.now())}</div>`;
  Rk.data.forEach(sec=>{
    body+=`<h3 style="margin:18px 0 6px;font-size:15px;font-family:Arial,sans-serif">${esc(sec.judul)}</h3>`;
    if(!sec.rows.length){
      body+=`<div style="font-size:12px;color:#777;font-family:Arial,sans-serif">Tidak ada data pada periode ini.</div>`;
    } else {
      body+=`<table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;font-size:11px;width:100%;font-family:Arial,sans-serif"><tr>${sec.kolom.map(k=>`<th style="background:#f2f2f2;text-align:left">${esc(k)}</th>`).join('')}</tr>${sec.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}</table>`;
    }
    if(sec.ringkasan&&sec.ringkasan.length){
      body+=`<div style="margin-top:6px;font-size:11px;font-family:Arial,sans-serif">${sec.ringkasan.map(r=>`<b>${esc(r.label)}:</b> ${esc(String(r.value))}`).join(' &nbsp;|&nbsp; ')}</div>`;
    }
  });
  return body;
}
function exportRekapPDF(){
  const Rk=window._rekapTerakhir;if(!Rk)return toast('Tampilkan rekap dulu sebelum mengunduh');
  if(typeof html2pdf==='undefined')return toast('⚠️ Modul PDF belum siap (butuh koneksi internet saat pertama kali membuka aplikasi). Coba muat ulang aplikasi.');
  const div=document.createElement('div');
  div.style.cssText='padding:20px;color:#111';
  div.innerHTML=_bodyRekapHTML(Rk);
  const fname=`Rekap_${labelJenisRekap(Rk.jenis)}_${fileDateLabel(Rk.start)}_${fileDateLabel(Rk.end)}.pdf`;
  toast('⏳ Membuat PDF...');
  html2pdf().from(div).set({margin:10,filename:fname,html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).save();
}
function exportRekapExcel(){
  const Rk=window._rekapTerakhir;if(!Rk)return toast('Tampilkan rekap dulu sebelum mengunduh');
  if(typeof XLSX==='undefined')return toast('⚠️ Modul Excel belum siap (butuh koneksi internet saat pertama kali membuka aplikasi). Coba muat ulang aplikasi.');
  const wb=XLSX.utils.book_new();
  Rk.data.forEach(sec=>{
    const aoa=[[sec.judul],[`Periode: ${tgl(Rk.start)} - ${tgl(Rk.end)}`],[],sec.kolom,...sec.rows];
    if(sec.ringkasan&&sec.ringkasan.length){aoa.push([]);sec.ringkasan.forEach(r=>aoa.push([r.label,r.value]));}
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    let sheetName=sec.judul.replace('Rekap ','').slice(0,31)||'Data';
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });
  const fname=`Rekap_${labelJenisRekap(Rk.jenis)}_${fileDateLabel(Rk.start)}_${fileDateLabel(Rk.end)}.xlsx`;
  XLSX.writeFile(wb,fname);
}
function exportRekapWord(){
  const Rk=window._rekapTerakhir;if(!Rk)return toast('Tampilkan rekap dulu sebelum mengunduh');
  const html=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset='utf-8'><title>Rekap</title></head><body>${_bodyRekapHTML(Rk)}</body></html>`;
  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`Rekap_${labelJenisRekap(Rk.jenis)}_${fileDateLabel(Rk.start)}_${fileDateLabel(Rk.end)}.doc`;a.click();
  URL.revokeObjectURL(url);
  toast('📝 File Word diunduh');
}

function renderRincianKategoriKas(){
  const byKat={};
  D.kas.forEach(k=>{
    const key=k.jenis+'|'+(k.kategori||'Lainnya');
    byKat[key]=(byKat[key]||0)+k.nominal;
  });
  const masukEntries=Object.entries(byKat).filter(([k])=>k.startsWith('masuk|')).sort((a,b)=>b[1]-a[1]);
  const keluarEntries=Object.entries(byKat).filter(([k])=>k.startsWith('keluar|')).sort((a,b)=>b[1]-a[1]);
  if(!masukEntries.length&&!keluarEntries.length)return'';
  let html='<div class="card" style="margin-bottom:12px"><div class="card-title" style="font-size:13px">📊 Rincian per Kategori</div>';
  if(masukEntries.length){
    html+='<div style="font-size:12px;font-weight:700;color:var(--ok);margin:8px 0 4px">Pemasukan</div>';
    masukEntries.forEach(([k,v])=>{html+=`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0"><span>${esc(k.split('|')[1])}</span><span style="font-weight:600">${fmtRp(v)}</span></div>`;});
  }
  if(keluarEntries.length){
    html+='<div style="font-size:12px;font-weight:700;color:var(--danger);margin:10px 0 4px">Pengeluaran</div>';
    keluarEntries.forEach(([k,v])=>{html+=`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0"><span>${esc(k.split('|')[1])}</span><span style="font-weight:600">${fmtRp(v)}</span></div>`;});
  }
  html+='</div>';
  return html;
}
function updateKategoriKas(){

function catatKas(){

function cetakNotulenPDF(){
  if(typeof html2pdf==='undefined'){toast('❌ Fitur PDF belum siap, cek koneksi internet lalu coba lagi');return;}
  const body=buildNotulenBodyHTML();
  const outer=document.createElement('div');
  outer.style.cssText='position:absolute;top:0;left:0;width:0;height:0;overflow:hidden';
  const wrap=document.createElement('div');
  wrap.style.cssText='width:210mm;background:#fff';
  const styleEl=document.createElement('style');
  styleEl.textContent=buildLaporanStyleCSS();
  wrap.appendChild(styleEl);
  const inner=document.createElement('div');
  inner.className='lap-cetak';
  inner.innerHTML=body;
  wrap.appendChild(inner);
  outer.appendChild(wrap);
  document.body.appendChild(outer);
  toast('📄 Membuat PDF, mohon tunggu...');
  html2pdf().set({
    margin:[10,10,10,10],
    filename:`notulen_evaluasi_paskibra_${new Date().toISOString().split('T')[0]}.pdf`,
    image:{type:'jpeg',quality:0.95},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['avoid-all','css','legacy']}
  }).from(wrap).save().then(()=>{
    document.body.removeChild(outer);
    toast('✅ PDF berhasil diunduh');
  }).catch(()=>{
    document.body.removeChild(outer);
    toast('❌ Gagal membuat PDF, coba lagi');
  });
}

  const blob=new Blob(['﻿'+html],{type:'application/msword;charset=utf-8'});

function downloadLaporanPDF(){
  if(typeof html2pdf==='undefined'){toast('❌ Fitur PDF belum siap, cek koneksi internet lalu coba lagi');return;}
  const bulanNum=new Date().toLocaleDateString('id-ID',{month:'long'});
  const tahun=new Date().getFullYear();
  const body=buildLaporanBodyHTML();
  const outer=document.createElement('div');
  outer.style.cssText='position:absolute;top:0;left:0;width:0;height:0;overflow:hidden';
  const wrap=document.createElement('div');
  wrap.style.cssText='width:210mm;background:#fff';
  const styleEl=document.createElement('style');
  styleEl.textContent=buildLaporanStyleCSS();
  wrap.appendChild(styleEl);
  const inner=document.createElement('div');
  inner.className='lap-cetak';
  inner.innerHTML=body;
  wrap.appendChild(inner);
  outer.appendChild(wrap);
  document.body.appendChild(outer);
  toast('📄 Membuat PDF, mohon tunggu...');
  html2pdf().set({
    margin:[10,10,10,10],
    filename:`laporan_paskibra_${bulanNum.toLowerCase().replace(/\s/g,'_')}_${tahun}.pdf`,
    image:{type:'jpeg',quality:0.95},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['avoid-all','css','legacy']}
  }).from(wrap).save().then(()=>{
    document.body.removeChild(outer);
    toast('✅ PDF berhasil diunduh');
  }).catch(()=>{
    document.body.removeChild(outer);
    toast('❌ Gagal membuat PDF, coba lagi');
  });

async function cekDiagnostikSinkron(){
  const el=document.getElementById('diag-sinkron-hasil');
  if(!el)return;
  el.innerHTML='<p style="font-size:12px;margin-top:10px">⏳ Mengecek...</p>';
  const DATA_KEYS_DIAG=['anggota','absensi','pelanggaran','pembinaanKhusus','proker','prokerTahunan','evaluasi','lomba','agenda','adat','info','kas','komando','pengumuman','pemetaan','samapta','materi','izin','paketSoal','hasilSimulasi','izinUlangSimulasi'];
  let html='';
  try{
    const t0=Date.now();
    const r=await fetch(GS_URL+'?t='+Date.now());
    const teks=await r.text();
    const waktu=Date.now()-t0;
    let d=null,parseError=null;
    try{d=JSON.parse(teks);}catch(e){parseError=e.message;}
    if(parseError||!d){
      html=`<div class="alert alert-danger" style="margin-top:10px">❌ Respons dari cloud BUKAN data JSON yang valid (kemungkinan halaman login Google atau error akses).</div>
      <p style="font-size:11px;color:var(--fg3);margin-top:6px">HTTP status: ${r.status} · Waktu: ${waktu}ms · Panjang respons: ${teks.length} karakter</p>
      <div style="font-size:11px;background:var(--bg2,#0003);padding:8px;border-radius:8px;margin-top:6px;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto">${esc(teks.slice(0,500))}</div>`;
    } else if(d.error){
      html=`<div class="alert alert-danger" style="margin-top:10px">❌ Cloud mengembalikan error: ${esc(JSON.stringify(d.error))}</div>`;
    } else {
      const rows=DATA_KEYS_DIAG.map(k=>{
        const v=d[k];
        const n=Array.isArray(v)?v.length:(v?1:0);
        return`<tr><td style="padding:3px 8px 3px 0">${k}</td><td style="padding:3px 0;text-align:right;font-weight:600">${n}</td></tr>`;
      }).join('');
      const prokerList=Array.isArray(d.proker)?d.proker.map(p=>'• '+(p.judul||'(tanpa judul)')).join('<br>'):'';
      window._lastGSSize=teks.length;
      const pctCek=Math.round(teks.length/BATAS_CLOUD*100);
      html=`<div class="alert alert-ok" style="margin-top:10px">✅ Berhasil terhubung ke cloud</div>
      <p style="font-size:11px;color:var(--fg3);margin-top:6px">Waktu respons: ${waktu}ms · Ukuran data: ${teks.length.toLocaleString('id')} / ${BATAS_CLOUD.toLocaleString('id')} karakter (${pctCek}%)${pctCek>=80?' ⚠️ Mendekati/melewati batas!':''}</p>
      <table style="font-size:12px;margin-top:8px;width:100%">${rows}</table>
      ${prokerList?`<div style="font-size:12px;margin-top:8px"><b>Isi proker di cloud saat ini:</b><br>${prokerList}</div>`:'<div style="font-size:12px;margin-top:8px;color:var(--fg3)">Tidak ada data proker di cloud sama sekali.</div>'}`;
    }
  }catch(e){
    html=`<div class="alert alert-danger" style="margin-top:10px">❌ Gagal menghubungi cloud: ${esc(e.message)}</div><p style="font-size:11px;color:var(--fg3);margin-top:6px">Cek koneksi internet HP ini, atau URL Apps Script di atas salah/sudah tidak aktif.</p>`;
  }
  el.innerHTML=html;
}

      <button onclick="pinKey('9')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">9</button>
      <button onclick="pinKey('←')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">←</button>
      <button onclick="pinKey('0')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">0</button>
      <button onclick="pinKey('✓')" style="padding:14px;font-size:18px;font-weight:700;background:var(--ok);border:none;border-radius:10px;cursor:pointer;color:#fff">✓</button>
    </div>
    <button onclick="cancelPin()" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--fg2);cursor:pointer;margin-top:4px">Batal</button>
  </div>
</div>
<style>.pd{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:.2s}.pd.filled{background:var(--accent);border-color:var(--accent)}</style>
