<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f4f0;--bg2:#fff;--fg:#1a1a1a;--fg2:#555;--fg3:#888;
  --accent:#bf2a20;--accent2:#0b2d6e;--gold:#b8870a;
  --ok:#157a44;--warn:#c97505;--danger:#bf2a20;
  --border:#ddd;--card:#fff;--nav:#fff;
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --r:12px;--rr:8px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111;--bg2:#1a1a1a;--fg:#f0ede8;--fg2:#aaa;--fg3:#666;
  --border:#333;--card:#1e1e1e;--nav:#1a1a1a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#111;--bg2:#1a1a1a;--fg:#f0ede8;--fg2:#aaa;--fg3:#666;
  --border:#333;--card:#1e1e1e;--nav:#1a1a1a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding-bottom:80px}
h1,h2,h3,.exo{font-family:'Exo 2',sans-serif}
img{max-width:100%}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{font-family:inherit}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;background:none;color:var(--fg3);font-size:10px;gap:2px;transition:.15s}
.nb.on{color:var(--accent)}
.nb svg{width:22px;height:22px}

/* HEADER */
#hdr{background:var(--accent2);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
#hdr img{width:44px;height:44px;border-radius:6px;object-fit:cover}
#hdr-text h1{font-size:18px;font-weight:900;letter-spacing:.5px}
#hdr-text p{font-size:11px;opacity:.8}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.role-badge{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}

/* SCREENS */
.screen{display:none;padding:12px 16px}
.screen.on{display:block}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

/* KOMANDO */
.komando-box{background:var(--accent);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px;animation:pulse-border 2s infinite}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(191,42,32,.4)}50%{box-shadow:0 0 0 8px rgba(191,42,32,0)}}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.komando-box h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-bottom:6px}
.komando-box p{font-size:15px;font-weight:600;line-height:1.5}
.komando-box .kmeta{font-size:11px;opacity:.7;margin-top:6px}
.pengumuman-box{background:var(--accent2);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px}
.pengumuman-box h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.8;margin-bottom:5px}

/* FORMS */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rr);background:var(--bg);color:var(--fg);font-size:14px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}

/* BUTTONS */
.btn{padding:11px 20px;border-radius:var(--rr);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-blue{background:var(--accent2);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%;justify-content:center}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-ok{background:#d4edda;color:var(--ok)}
.badge-warn{background:#fff3cd;color:var(--warn)}
.badge-danger{background:#fde;color:var(--danger)}
.badge-info{background:#d1ecf1;color:#0a6c82}
.badge-grey{background:var(--border);color:var(--fg2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
.badge-ok{background:#0d3321;color:#4ade80}
.badge-warn{background:#3a2500;color:#fbbf24}
.badge-danger{background:#3a0a0a;color:#f87171}
.badge-info{background:#0a2030;color:#67e8f9}
}}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:14px;gap:0;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--fg3);background:none;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* LISTS */
.item{background:var(--card);border-radius:var(--rr);padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-title{font-weight:600;font-size:14px}
.item-sub{font-size:12px;color:var(--fg2);margin-top:3px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-box{background:var(--card);border-radius:var(--rr);padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-box .n{font-size:24px;font-weight:900;font-family:'Exo 2',sans-serif}
.stat-box .l{font-size:11px;color:var(--fg2);margin-top:2px}

/* SECTION TITLE */
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);margin:16px 0 8px}

/* ALERT */
.alert{padding:10px 14px;border-radius:var(--rr);font-size:13px;margin-bottom:10px}
.alert-warn{background:#fff3cd;color:#7a4800;border-left:3px solid var(--warn)}
.alert-danger{background:#fde;color:#7a0000;border-left:3px solid var(--danger)}
.alert-ok{background:#d4edda;color:#0d3321;border-left:3px solid var(--ok)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
.alert-warn{background:#3a2500;color:#fbbf24}
.alert-danger{background:#3a0a0a;color:#f87171}
.alert-ok{background:#0d3321;color:#4ade80}
}}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;font-family:'Exo 2',sans-serif}
.modal-close{float:right;background:none;color:var(--fg2);font-size:20px;line-height:1}

/* TTD CANVAS */
#ttd-canvas{border:2px dashed var(--border);border-radius:var(--rr);touch-action:none;width:100%;height:160px;cursor:crosshair}

/* PEMETAAN GAUGE */
.gauge-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gauge-label{width:80px;font-size:12px;color:var(--fg2)}
.gauge-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.gauge-fill{height:100%;background:var(--accent);border-radius:4px;transition:.4s}
.gauge-val{width:28px;text-align:right;font-size:12px;font-weight:700}

/* REKAP ALERT */
.rekap-item{background:var(--card);border-radius:var(--rr);padding:12px;margin-bottom:8px;border-left:4px solid var(--danger)}

/* PHOTO PREVIEW */
.photo-prev{width:100%;max-height:200px;object-fit:cover;border-radius:var(--rr);margin-top:8px}

/* RING */
.ring{display:inline-block;width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--accent2)}
#login-screen h1{color:#fff;font-size:28px;font-weight:900;text-align:center;margin-top:12px}
#login-screen p{color:rgba(255,255,255,.75);font-size:13px;text-align:center;margin-top:4px;margin-bottom:28px}
.login-slogan{color:#FFD700;font-size:11px;font-style:italic;letter-spacing:.5px;text-align:center;margin-top:-20px;margin-bottom:28px;opacity:.9}
.login-card{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px}
.role-btn{width:100%;padding:11px 14px;border-radius:var(--rr);background:var(--bg);color:var(--fg);font-size:14px;font-weight:600;text-align:left;border:1.5px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:10px;transition:.15s}
.role-btn:hover{border-color:var(--accent);color:var(--accent)}
.role-btn .ri{font-size:20px}

/* KEUANGAN */
.kas-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.kas-item:last-child{border:none}

/* SHARE BTN WA */
.wa-btn{background:#25D366;color:#fff;border-radius:var(--rr);padding:10px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;width:100%;justify-content:center}

<script>
// ═══════════════════════════════════════════
// DATA STORE
// ═══════════════════════════════════════════
const SK = 'pramansabel_v3';
const PIN_ROLES=['pembina','pelatih','aspelatih1','aspelatih2','ketua','sekretaris','bendahara','tatib'];
let _pinBuf='';let _pinTarget='';let _pinCb=null;let _pinMode='check';let _pinNewBuf='';

function hashPin(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return h.toString(36);}
function getPins(){return D.pins||{};}
function savePins(o){D.pins=o;save();}
function hasPin(role){return !!(D.pins&&D.pins[role]);}

function openPinModal(role, mode, cb){
  _pinBuf='';_pinNewBuf='';_pinTarget=role;_pinCb=cb;_pinMode=mode;
  document.getElementById('pin-role-label').textContent=RLBL[role]||role;
  document.getElementById('pin-desc').textContent=mode==='set'?'Buat PIN baru (4 digit) untuk role ini':mode==='change'?'Masukkan PIN lama terlebih dahulu':'Masukkan PIN untuk mengakses role ini';
  document.getElementById('pin-err').textContent='';
  updatePinDots();
  document.getElementById('pin-overlay').style.display='flex';
}
function cancelPin(){document.getElementById('pin-overlay').style.display='none';_pinBuf='';_pinCb=null;}
function updatePinDots(){
  document.querySelectorAll('#pin-dots .pd').forEach((d,i)=>d.classList.toggle('filled',i<_pinBuf.length));
}
function pinKey(k){
  if(k==='←'){_pinBuf=_pinBuf.slice(0,-1);updatePinDots();document.getElementById('pin-err').textContent='';return;}
  if(k==='✓'){
    if(_pinBuf.length<4){document.getElementById('pin-err').textContent='PIN harus 4 digit';return;}
    submitPin();return;
  }
  if(_pinBuf.length>=4)return;
  _pinBuf+=String(k);
  updatePinDots();
}
function submitPin(){
  const pins=getPins();
  if(_pinMode==='set'){
    if(!_pinNewBuf){_pinNewBuf=_pinBuf;_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Ulangi PIN baru untuk konfirmasi';document.getElementById('pin-err').textContent='';return;}
    if(_pinBuf!==_pinNewBuf){document.getElementById('pin-err').textContent='PIN tidak cocok, coba lagi';_pinBuf='';_pinNewBuf='';updatePinDots();return;}
    pins[_pinTarget]=hashPin(_pinBuf);savePins(pins);
    document.getElementById('pin-overlay').style.display='none';_pinBuf='';_pinNewBuf='';
    toast('PIN berhasil disimpan untuk '+RLBL[_pinTarget]);
    if(_pinCb)_pinCb(true);return;
  }
  if(_pinMode==='change'){
    if(!_pinNewBuf&&!pins[_pinTarget]){// no existing pin, treat as set
      _pinNewBuf=_pinBuf;_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Ulangi PIN baru';return;
    }
    if(!_pinNewBuf){// verify old pin first
      if(pins[_pinTarget]&&hashPin(_pinBuf)!==pins[_pinTarget]){document.getElementById('pin-err').textContent='PIN lama salah';_pinBuf='';updatePinDots();return;}
      _pinNewBuf='OLD_VERIFIED';_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Masukkan PIN baru (4 digit)';return;
    }
    if(_pinNewBuf==='OLD_VERIFIED'){_pinNewBuf=_pinBuf;_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Ulangi PIN baru';return;}
    if(_pinBuf!==_pinNewBuf){document.getElementById('pin-err').textContent='PIN tidak cocok';_pinBuf='';updatePinDots();return;}
    pins[_pinTarget]=hashPin(_pinBuf);savePins(pins);
    document.getElementById('pin-overlay').style.display='none';_pinBuf='';_pinNewBuf='';
    toast('PIN berhasil diubah');if(_pinCb)_pinCb(true);return;
  }
  // mode check
  if(!pins[_pinTarget]){document.getElementById('pin-overlay').style.display='none';_pinBuf='';if(_pinCb)_pinCb(true);return;}
  if(hashPin(_pinBuf)!==pins[_pinTarget]){document.getElementById('pin-err').textContent='PIN salah, coba lagi';_pinBuf='';updatePinDots();return;}
  document.getElementById('pin-overlay').style.display='none';_pinBuf='';if(_pinCb)_pinCb(true);
}

const RLBL_STATIC = {
  pembina:'🎖 Pembina',pelatih:'🏃 Pelatih',
  aspelatih1:'👟 Asisten Pelatih 1',aspelatih2:'👟 Asisten Pelatih 2',
  ketua:'⭐ Ketua PPS',sekretaris:'📋 Sekretaris',
  bendahara:'💰 Bendahara',tatib:'⚖️ TATIB',
  capas:'🎗️ Capas (Calon Paskib)',balonpas:'🌱 Balonpas',
  purna:'🎓 Purna PASKIBRA'
};
// RLBL: hanya 2 "slot" angkatan PPS yang bersirkulasi (Aktif & Senior).
// Labelnya dinamis mengikuti D.config.tahunAktif/tahunSenior, jadi tidak perlu
// ditambah peran baru tiap tahun — Proxy ini membuat RLBL['pps_aktif'] selalu
// otomatis menunjukkan angkatan yang sedang aktif saat ini.

  if(!ONESIGNAL_APP_ID)return toast('⚠️ Notifikasi push belum disetel Pembina. Lihat Pengaturan → Notifikasi.');
  if(!window.OneSignalDeferred)return toast('⚠️ Modul notifikasi belum siap (butuh internet). Coba lagi sebentar.');

  setTimeout(()=>{
    if(_selesai)return;
    toast('⏳ Belum ada respons dari layanan notifikasi (>6 detik).'+(_oneSignalInitErr?(' Error: '+_oneSignalInitErr):' Coba cek koneksi internet atau pengaturan Site URL di OneSignal.'));
  },6000);
  OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.Notifications.requestPermission();
      const aktif=OneSignal.Notifications.permission;
      _selesai=true;
      toast(aktif?'🔔 Notifikasi diaktifkan di HP ini!':'❌ Izin notifikasi ditolak — aktifkan lewat pengaturan browser kalau berubah pikiran.');
      renderPengaturan();

// Hapus satu item dari daftar sekaligus MENANDAINYA sebagai terhapus (tombstone).
// Kenapa perlu: sinkronisasi cloud menggabungkan data per-id dari cloud+lokal supaya
// input baru dari HP lain tidak hilang — tapi akibatnya kalau item cuma dibuang dari
// array lokal lalu sinkron, cloud masih punya item itu dan langsung "menghidupkannya"
// lagi di gabungan berikutnya (makanya item yang dihapus kelihatan muncul lagi).
// Dengan mencatat id-nya di D._del, gabungan manapun (lihat mergeField) akan selalu
// membuang id tersebut, dari cloud maupun lokal, sampai kapanpun.
function tandaHapus(key,id){
  D[key]=(D[key]||[]).filter(x=>x.id!==id);
  if(!D._del)D._del={};
  if(!D._del[key])D._del[key]=[];
  if(!D._del[key].includes(id))D._del[key].push(id);
}
// Gabungkan dua daftar id-terhapus (lokal & cloud) jadi satu — sekali suatu id pernah
// ditandai terhapus di manapun, ia tetap terhapus di gabungan manapun selanjutnya.
function gabungDel(localDel,cloudDel){
  const out={};
  const keys=new Set([...Object.keys(localDel||{}),...Object.keys(cloudDel||{})]);
  keys.forEach(k=>{
    const a=(localDel&&localDel[k])||[];
    const b=(cloudDel&&cloudDel[k])||[];
    out[k]=Array.from(new Set([...a,...b]));
  });
  return out;
}
function mergeField(key,localVal,cloudVal,delMerged){
  if(DATA_ARRAY_KEYS.includes(key)){
    const cloudArr=Array.isArray(cloudVal)?cloudVal:[];
    const localArr=Array.isArray(localVal)?localVal:[];
    const map=new Map();
    // Isi dari cloud dulu (mungkin ditambah/diubah dari HP lain), lalu data
    // lokal menimpa per-item berdasarkan id — jadi item baru dari HP lain
    // TETAP ada, dan perubahan yang baru kita buat juga tidak hilang.
    cloudArr.forEach(it=>{ if(it&&it.id!=null)map.set(it.id,it); });
    localArr.forEach(it=>{ if(it&&it.id!=null)map.set(it.id,it); });
    const delIds=(delMerged&&delMerged[key])||[];
    delIds.forEach(id=>map.delete(id));
    return Array.from(map.values());
  }
  if(key==='pins'||key==='config')return Object.assign({},cloudVal||{},localVal||{});
  if(key==='ttd')return(localVal!=null&&localVal!=='')?localVal:cloudVal;
  return localVal!==undefined?localVal:cloudVal;
}
async function saveGS(){
  if(!GS_URL)return;
  let payload=D;
  try{
    // PENTING: ambil dulu data cloud terbaru sebelum menimpa, lalu gabung per-item.
    // Sebelumnya device yang sinkron cloud terakhir akan menimpa HABIS seluruh
    // data dengan datanya sendiri (snapshot lama) — inilah sebab proker/absensi
    // yang baru diinput Ketua/Sekretaris bisa "hilang lagi" walau sudah tersimpan
    // di HP-nya sendiri: HP lain yang auto-sync belakangan menimpa data itu
        // dengan versi lamanya. Dengan digabung per-id, ini tidak terjadi lagi.
    const r=await fetch(GS_URL+'?t='+Date.now());
    const cloud=await r.json();
    if(cloud&&!cloud.error&&cloud.anggota!==undefined){
      const delMerged=gabungDel(D._del,cloud._del);
      const merged={};
      const keys=new Set([...Object.keys(D),...Object.keys(cloud)]);
      keys.forEach(k=>{ if(k!=='_del')merged[k]=mergeField(k,D[k],cloud[k],delMerged); });
      merged._del=delMerged;
      D=Object.assign(D,merged);
      try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}
      payload=D;
    }
  }catch(e){}
  const d={...payload,ttd:null};
  const teksKirim=JSON.stringify(d);
  window._lastGSSize=teksKirim.length;
  // JANGAN kirim kalau sudah pasti bakal ditolak (batas realistis backend) —
  // sebelumnya push yang gagal di sisi server diam saja (fetch().catch(()=>{})
  // tidak pernah mengecek isi responsnya), jadi data terlihat "tersimpan" di
  // HP pembuatnya padahal tidak pernah sampai ke cloud. Sejak backend diubah
  // untuk menyimpan data terpecah ke banyak sel (lihat AppsScript_Backend_Baru.gs),
  // batas 50.000 karakter per sel Google Sheets sudah tidak lagi jadi batas
  // TOTAL data aplikasi — angka di bawah ini cuma jaring pengaman supaya data
  // yang tumbuh di luar kewajaran tidak bikin sinkron lambat/timeout.
  if(teksKirim.length>BATAS_CLOUD_KIRIM){
    window._gsOverCapacity=true;
    toast('🚫 GAGAL sinkron ke cloud: data sudah melewati batas penyimpanan ('+BATAS_CLOUD_KIRIM.toLocaleString('id')+' karakter). Buka Pengaturan → Sinkron untuk detail.');
    return;
  }
  window._gsOverCapacity=false;
  _pendingPush=fetch(GS_URL,{method:'POST',body:teksKirim}).catch(()=>{}).finally(()=>{_pendingPush=null;});
  return _pendingPush;
}
async function loadGS(){
  if(!GS_URL)return false;
  try{
    const r=await fetch(GS_URL+'?t='+Date.now());
    const d=await r.json();
    if(d&&!d.error&&d.anggota!==undefined){
      const ttdLama=D.ttd;
      const def=defD();
      const cloudFull=Object.assign(def,d);
      // PENTING: gabung dengan data lokal yang sedang ada, JANGAN timpa habis.
      // loadGS() dipanggil otomatis di banyak tempat (buka app, pindah layar,
      // tiap 5 detik) — kalau ambil data cloud ini kebetulan selesai tepat
      // setelah sesuatu baru disimpan di HP ini (misalnya baru klik "Simpan
      // Proker"), menimpa habis D akan membuat input yang baru itu hilang
      // lagi seolah tidak pernah tersimpan. Dengan digabung per-id, data yang
      // baru dibuat di HP ini maupun dari HP lain sama-sama tetap ada.
      const delMerged=gabungDel(D._del,cloudFull._del);
      const merged={};
      const keys=new Set([...Object.keys(D),...Object.keys(cloudFull)]);
      keys.forEach(k=>{ if(k!=='_del')merged[k]=mergeField(k,D[k],cloudFull[k],delMerged); });
      merged._del=delMerged;
      D=Object.assign(cloudFull,merged);
      D.config=Object.assign(def.config,merged.config||{});
      migrasiAngkatan();
      if(!D.ttd&&ttdLama)D.ttd=ttdLama;
      try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}
      window._lastSyncTime=Date.now();
      return true;
    }
  }catch(e){}
  return false;
}

let _lastKomId='',_lastPngId='';
setInterval(async()=>{
  if(!GS_URL||!R)return;
  // Jika baru simpan lokal <8 detik lalu, tunggu push selesai dulu, jangan tarik data lama
  if(Date.now()-_lastLocalSave<8000){

  }
  const prevKomLen=D.komando.length,prevPngLen=D.pengumuman.length;
  loadGS().then(ok=>{
    if(!ok)return;

      if(p&&p.id!==_lastPngId){_lastPngId=p.id;showNotif('📢 Pengumuman Baru',p.pesan);}
    }
    // Hanya refresh beranda, jangan ganggu tab lain — dan jangan ganggu kalau user sedang mengetik
    const activeScreen=document.querySelector('.screen.on')?.id?.replace('s-','');
    const sedangMengetik=document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName);

},5000);

function kirimNotifOS(judul,pesan){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opts={body:pesan.substring(0,150),icon:_logoB64,badge:_logoB64,tag:'pramansabel-'+Date.now(),vibrate:[200,100,200]};
  try{
    if('serviceWorker' in navigator && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(judul,opts)).catch(()=>{try{new Notification(judul,opts);}catch(e){}});

function konfirmasiRespon(tipe,id){
  const sel=document.getElementById('resp-nama')?.value;
  const nama=sel==='__lain__'?document.getElementById('resp-nama-custom')?.value.trim():sel;
  if(!nama)return toast('Pilih atau tulis nama dulu');
  const arr=tipe==='komando'?D.komando:D.pengumuman;
  const item=arr.find(x=>x.id===id);
  if(!item)return;
  if(!item.respon)item.respon=[];
  const existing=item.respon.find(r=>r.nama.toLowerCase()===nama.toLowerCase());
  if(existing){existing.waktu=Date.now();}
  else item.respon.push({nama,waktu:Date.now(),role:R});
  try{localStorage.setItem('pramansabel_respon_'+tipe+'_'+id,nama);}catch(e){}
  save();closeModal();toast('✅ Respon tercatat, terima kasih!');

  const arr=tipe==='komando'?D.komando:D.pengumuman;

  if(!item||!item.respon||!item.respon.length)return toast('Belum ada yang merespon pesan ini');

  const belum=D.anggota.filter(a=>a.status==='aktif'&&!sudahNama.includes(a.nama.toLowerCase()));

// Ubah teks komando/pengumuman yang diketik jadi gambar atau PDF rapi, lalu tawarkan share ke WA
function wrapTextCanvas(ctx,teks,x,y,maxWidth,lineHeight){
  const paragraf=teks.split('\n');
  let cy=y;
  paragraf.forEach(par=>{
    const words=par.split(' ');
    let line='';
    words.forEach(w=>{
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>maxWidth&&line){
        ctx.fillText(line,x,cy);cy+=lineHeight;line=w;
      } else line=test;
    });
    ctx.fillText(line,x,cy);cy+=lineHeight;
  });
  return cy;
}
function buatGambarTeks(judul,teks,dari){
  const W=800;
  const canvas=document.createElement('canvas');
  const tmpCtx=canvas.getContext('2d');
  tmpCtx.font='20px Arial';
  // Estimasi tinggi dulu dari jumlah baris
  const baris=teks.split('\n').reduce((n,par)=>{
    let line='',count=0;
    par.split(' ').forEach(w=>{
      const test=line?line+' '+w:w;
      if(tmpCtx.measureText(test).width>W-100&&line){count++;line=w;}else line=test;
    });
    return n+count+1;
  },0);
  const H=260+baris*30+120;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  // Header merah
  ctx.fillStyle='#b91c1c';ctx.fillRect(0,0,W,110);
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.fillText(judul,50,55);
  ctx.font='14px Arial';ctx.fillText('PASKIBRA MAN 1 BELITUNG — PASMANSABEL',50,85);
  // Garis aksen
  ctx.fillStyle='#fef2f2';ctx.fillRect(0,110,W,8);
  // Isi teks
  ctx.fillStyle='#1a1a1a';ctx.font='20px Arial';
  const endY=wrapTextCanvas(ctx,teks,50,170,W-100,30);
  // Footer
  ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(50,endY+30);ctx.lineTo(W-50,endY+30);ctx.stroke();
  ctx.fillStyle='#888';ctx.font='italic 15px Arial';
  ctx.fillText(`— ${dari} · ${tgl()}`,50,endY+60);
  return canvas;
}
function buatFileDariTeks(inputId,format){
  const teks=document.getElementById(inputId)?.value.trim();
  if(!teks)return toast('Tulis isinya dulu di kolom atas');
  const judul=inputId==='inp-kom'?'⚡ KOMANDO PASKIBRA':'📢 PENGUMUMAN PASKIBRA';
  const namaFile=inputId==='inp-kom'?'komando':'pengumuman';
  if(format==='gambar'){
    const canvas=buatGambarTeks(judul,teks,RLBL[R]);
    canvas.toBlob(blob=>{
      shareAtauUnduh(blob,`${namaFile}_${Date.now()}.png`,'image/png',judul);
    },'image/png',0.95);
  } else {
    if(typeof html2pdf==='undefined'){toast('❌ Fitur PDF belum siap, cek koneksi internet');return;}
    const outer=document.createElement('div');
    outer.style.cssText='position:absolute;top:0;left:0;width:0;height:0;overflow:hidden';
    const wrap=document.createElement('div');
    wrap.style.cssText='width:210mm;background:#fff;padding:20mm;font-family:Arial,sans-serif';
    wrap.innerHTML=`<div style="border-bottom:3px solid #b91c1c;padding-bottom:12px;margin-bottom:16px">
      <h1 style="color:#b91c1c;font-size:20pt;margin:0">${judul}</h1>
      <p style="color:#666;font-size:10pt;margin:4px 0 0">PASKIBRA MAN 1 BELITUNG — PASMANSABEL</p>
    </div>
    <p style="font-size:13pt;line-height:1.8;white-space:pre-wrap">${esc(teks)}</p>
    <p style="margin-top:30px;color:#888;font-size:10pt;font-style:italic">— ${RLBL[R]} · ${tgl()}</p>`;
    outer.appendChild(wrap);
    document.body.appendChild(outer);
    toast('📄 Membuat PDF...');
    html2pdf().set({margin:0,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(wrap).outputPdf('blob').then(blob=>{
      document.body.removeChild(outer);
      shareAtauUnduh(blob,`${namaFile}_${Date.now()}.pdf`,'application/pdf',judul);
    }).catch(()=>{document.body.removeChild(outer);toast('❌ Gagal membuat PDF');});
  }
}
function shareAtauUnduh(blob,filename,mime,judul){
  const file=new File([blob],filename,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:judul}).catch(()=>{unduhBlob(blob,filename);});
  } else {
    unduhBlob(blob,filename);
    toast('📥 File diunduh — buka file lalu share manual ke WA');
  }
}
function unduhBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

}

function downloadTemplateCSV(){

  const contoh=[

function importCSV(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
    if(!lines.length)return toast('File CSV kosong');
    const header=lines[0].toLowerCase().split(',').map(h=>h.trim());
    const iNama=header.indexOf('nama');
    const iKelas=header.indexOf('kelas');
    const iRole=header.indexOf('role');
    const iJabatan=header.indexOf('jabatan');
    const iHp=header.indexOf('hp');
    const iStatus=header.indexOf('status');
    if(iNama<0||iRole<0)return toast('Kolom "nama" dan "role" wajib ada di CSV');
    const validRoles=['pps_aktif','pps_senior','capas','balonpas'];
    let added=0,skip=0;
    lines.slice(1).forEach(line=>{
      if(!line.trim()||line.startsWith('#'))return;
      const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      const nama=cols[iNama]||'';
      const role=cols[iRole]||'balonpas';
      if(!nama){skip++;return;}
      if(!validRoles.includes(role)){skip++;return;}
      if(D.anggota.find(a=>a.nama.toLowerCase()===nama.toLowerCase())){skip++;return;}
      D.anggota.push({
        id:uid(),nama,
        kelas:iKelas>=0?cols[iKelas]||'':'' ,
        role,
        angkatan:role==='pps_aktif'?D.config.tahunAktif:(role==='pps_senior'?D.config.tahunSenior:undefined),
        jabatan:iJabatan>=0?cols[iJabatan]||'':'',
        hp:iHp>=0?cols[iHp]||'':'',
        status:iStatus>=0&&cols[iStatus]?cols[iStatus]:'aktif',
        tglDaftar:Date.now()
      });
      added++;
    });
    save();
    inp.value='';
    toast(`✅ ${added} anggota berhasil diimport${skip?' ('+skip+' dilewati)':''}`);
    tabAnggota('daftar',null);
    document.querySelectorAll('#s-anggota .tab')[0].classList.add('on');
  };
  reader.readAsText(file);
}

// ═══ IMPORT BALONPAS DARI WORD / EXCEL / PDF ═══
function importBalonpasDoc(inp){
  const file=inp.files[0];if(!file)return;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  toast('⏳ Membaca file...');
  if(ext==='xlsx'||ext==='xls'){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        parseBalonpasRows(rows);
      }catch(err){toast('Gagal membaca Excel: '+err.message);}
      inp.value='';
    };
    reader.readAsArrayBuffer(file);
  } else if(ext==='docx'||ext==='doc'){
    if(ext==='doc')return toast('Format .doc lama tidak didukung, pakai .docx'),inp.value='';
    const reader=new FileReader();
    reader.onload=e=>{
      mammoth.extractRawText({arrayBuffer:e.target.result}).then(res=>{
        showBalonpasTextPreview(res.value,file.name);
      }).catch(err=>toast('Gagal membaca Word: '+err.message));
      inp.value='';
    };
    reader.readAsArrayBuffer(file);
  } else if(ext==='pdf'){
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const pdf=await pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise;
        let teks='';
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          let lastY=null,baris='';
          content.items.forEach(it=>{
            if(lastY!==null&&Math.abs(it.transform[5]-lastY)>4){baris+='\n';}
            baris+=it.str+' ';
            lastY=it.transform[5];
          });
          teks+=baris+'\n';
        }
        showBalonpasTextPreview(teks,file.name);
      }catch(err){toast('Gagal membaca PDF: '+err.message);}
      inp.value='';
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Format tidak didukung. Gunakan .xlsx, .docx, atau .pdf');
    inp.value='';
  }
}
// Excel: coba deteksi kolom nama/kelas/hp dari header, kalau tidak ada anggap kolom A = nama
function parseBalonpasRows(rows){
  if(!rows.length)return toast('File Excel kosong');
  let startIdx=0,iNama=0,iKelas=-1,iHp=-1;
  const header=(rows[0]||[]).map(h=>String(h||'').toLowerCase().trim());
  if(header.includes('nama')){
    startIdx=1;
    iNama=header.indexOf('nama');
    iKelas=header.indexOf('kelas');
    iHp=header.indexOf('hp');
  }
  const list=[];
  rows.slice(startIdx).forEach(r=>{
    const nama=String(r[iNama]||'').trim();
    if(!nama)return;
    list.push({nama,kelas:iKelas>=0?String(r[iKelas]||'').trim():'',hp:iHp>=0?String(r[iHp]||'').trim():''});
  });
  if(!list.length)return toast('Tidak ada nama terbaca dari file Excel');
  showBalonpasListPreview(list);
}
// Word & PDF: teks mentah ditampilkan dulu agar bisa dirapikan user, lalu dipecah per baris jadi nama
function showBalonpasTextPreview(teks,namaFile){
  const bersih=teks.split('\n').map(l=>l.trim()).filter(Boolean).join('\n');

  <p style="font-size:12px;color:var(--fg2);margin-bottom:8px">${list.length} nama terdeteksi. Hilangkan centang untuk melewati nama yang tidak valid.</p>

function simpanBalonpasList(list){
  const checks=document.querySelectorAll('.bp-chk');

  checks.forEach(chk=>{
    if(!chk.checked)return;
    const x=list[+chk.dataset.bpIdx];
    if(!x||!x.nama){skip++;return;}
    if(D.anggota.find(a=>a.nama.toLowerCase()===x.nama.toLowerCase())){skip++;return;}
    D.anggota.push({id:uid(),nama:x.nama,kelas:x.kelas||'',role:'balonpas',jabatan:'Calon PPS',hp:x.hp||'',status:'aktif',tglDaftar:Date.now()});
    added++;
  });
  save();closeModal();
  toast(`✅ ${added} data balonpas tersimpan${skip?' ('+skip+' dilewati)':''}`);
  tabAnggota('daftar',null);

function lantikAnggota(id){
  // Hanya Pembina yang bisa menjalankan ini (dijaga lewat tombol "✅ ACC & Lantik PPS").
  // Boleh langsung dari status capas manapun, baik sudah diajukan atau belum —
  // artinya ini sekaligus berfungsi sebagai ACC persetujuan Pembina.
  const a=D.anggota.find(x=>x.id===id);if(!a)return;
  // Anggota yang dilantik selalu masuk ke angkatan AKTIF saat ini (D.config.tahunAktif).
  // Angkatan aktif baru berpindah lewat tombol "Pergantian Angkatan" (gantiAngkatan()).
  if(!confirm(`ACC & Lantik ${a.nama} menjadi PPS Angkatan ${D.config.tahunAktif}?`))return;
  a.role='pps_aktif';a.angkatan=D.config.tahunAktif;a.status='aktif';a.tglLantik=Date.now();a.diaccOleh=RLBL[R]||R;
  delete a.diajukanLantik;
  save();toast(`${a.nama} dilantik menjadi PPS Angkatan ${D.config.tahunAktif}!`);renderAnggota();
}
function gantiAngkatan(){
  const tAktif=D.config.tahunAktif,tSenior=D.config.tahunSenior;
  const jmlSenior=D.anggota.filter(a=>a.role==='pps_senior').length;
  const jmlAktif=D.anggota.filter(a=>a.role==='pps_aktif').length;
  const tahunBaru=tAktif+1;
  if(!confirm(`PERGANTIAN ANGKATAN PPS\n\n1) PPS Angkatan ${tSenior} (Senior, ${jmlSenior} orang) dianggap sudah LULUS SEKOLAH — datanya TIDAK dihapus, tapi dipindah jadi "Purna PASKIBRA" (alumni) supaya riwayatnya tetap tersimpan.\n2) PPS Angkatan ${tAktif} (Aktif, ${jmlAktif} orang) otomatis naik jadi Angkatan Senior — tetap bantu melatih & membimbing angkatan baru.\n3) Slot Angkatan Aktif berikutnya jadi Angkatan ${tahunBaru} — siap diisi balonpas yang dilantik selanjutnya.\n\nIni tidak bisa dibatalkan. Lanjutkan?`))return;
  // Dulu: data Angkatan Senior yang lulus langsung DIHAPUS habis dari array
  // (D.anggota=D.anggota.filter(a=>a.role!=='pps_senior')) — riwayat alumni jadi
  // hilang sama sekali. Sekarang: dipindah jadi role 'purna' (Purna PASKIBRA),
  // datanya tetap ada sebagai arsip alumni, cuma tidak lagi masuk hitungan aktif.
  D.anggota.forEach(a=>{
    if(a.role==='pps_senior'){
      a.role='purna';a.status='purna';a.angkatanPurna=tSenior;a.tglPurna=Date.now();
    } else if(a.role==='pps_aktif'){
      a.role='pps_senior';
    }
  });
  D.config.tahunSenior=tAktif;
  D.config.tahunAktif=tahunBaru;
  save();
  toast(`✅ Pergantian selesai. Angkatan ${tSenior} jadi Purna PASKIBRA (datanya tetap tersimpan), Angkatan ${tAktif} jadi Senior, Angkatan ${tahunBaru} jadi Aktif.`);
  renderAnggota();
}

function todayLocalInputDate(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
// Kunci tanggal kanonik (YYYY-MM-DD) — TIDAK bergantung pada locale/engine
// browser HP masing-masing. Dipakai untuk field `tgl` absensi SEJAK sekarang.
// Sebelumnya `tgl` disimpan dengan toLocaleDateString('id-ID') (misal "5/11/2026"),
// yang formatnya bisa berbeda tipis antar HP/browser (ada yang kasih "05/11/2026",
// ada yang "5/11/2026") — kalau HP Sekretaris & HP Pembina menghasilkan format
// berbeda untuk tanggal yang SAMA, absensi yang baru diisi jadi "tidak kelihatan"
// di HP lain walau datanya sudah tersinkron, karena pencariannya tidak match
// persis secara string. Untuk data lama yang masih pakai format lama, dicek
// juga sebagai fallback di bawah supaya tidak hilang.
function tglKanon(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function tglLegacyID(y,m,d){return new Date(y,m-1,d).toLocaleDateString('id-ID');}
let _absensiTglPilih=todayLocalInputDate();
// Filter tampilan Daftar Pengajuan Izin — biar daftar tetap rapi tanpa menghapus data
// (izin yang masih pending tetap selalu tampil apa pun filternya; data penuh tetap bisa direkap/CSV).
let _izinFilter='minggu';
function rentangTanggalIzin(filter){
  const now=new Date();
  if(filter==='minggu'){ const d=new Date(now); d.setDate(d.getDate()-7); return d; }
  if(filter==='bulan'){ const d=new Date(now); d.setDate(d.getDate()-30); return d; }
  return null; // 'semua'
}
function pilihFilterIzin(v){
  _izinFilter=v;
  const el=document.getElementById('tab-anggota');
  if(el) el.innerHTML=renderIzin();
}
let _sesiAktifIdx=0;
function renderAbsensi(){
  const canAccess=C.absensi_edit(R)||C.isAnggota(R)||C.komando_kirim(R)||C.isPengurus(R);
  if(!canAccess){
    return'<div class="alert alert-warn">Hanya Sekretaris yang dapat mengisi absensi.</div>';
  }
  const sesiTabs=SESI.map((s,i)=>`<button class="tab${i===0?' on':''}" onclick="tabSesi(${i},this)">${s}</button>`).join('');
  const dlBtn=(C.absensi_edit(R)||C.isPengurus(R))?`<button class="btn btn-blue btn-sm" style="float:right;margin-bottom:8px" onclick="downloadAbsensiCSV()">📥 Download CSV</button>`:'';
  const dateInput=`<div class="field" style="margin-bottom:10px"><label>📅 Pilih Tanggal</label><input type="date" id="abs-tgl-pilih" value="${_absensiTglPilih}" onchange="pilihTglAbsensi(this.value)"></div>`;
  return`${dlBtn}${dateInput}<div class="tabs">${sesiTabs}</div><div id="tab-sesi"></div>`;
}
function pilihTglAbsensi(v){
  if(!v)return;
  _absensiTglPilih=v;
  renderSesi(_sesiAktifIdx);
}
function downloadAbsensiCSV(){
  const [yy,mm,dd]=_absensiTglPilih.split('-').map(Number);
  const tglTampil=tglKanon(yy,mm,dd);
  const tglLegacy=tglLegacyID(yy,mm,dd);
  let csv='Nama,Kelas,Peran,';
  csv+=SESI.join(',')+'\n';
  D.anggota.filter(a=>a.status==='aktif').forEach(a=>{
    const row=[a.nama,a.kelas||'-',RLBL[a.role]||a.role];
    SESI.forEach((_,si)=>{
      const rec=D.absensi.find(x=>x.anggotaId===a.id&&x.sesi===si&&(x.tgl===tglTampil||x.tgl===tglLegacy));
      row.push(rec?.status||'-');
    });
    csv+=row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`absensi_${_absensiTglPilih}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('📥 CSV absensi diunduh untuk tanggal '+tglTampil);
}

// Panggil setelah renderAbsensi
setTimeout(()=>{
  const el=document.getElementById('tab-sesi');
  if(el) renderSesi(0);
},50);

function tabSesi(i,btn){
  document.querySelectorAll('#tab-anggota .tabs .tab').forEach(b=>b.classList.remove('on'));
  btn?.classList.add('on');
  _sesiAktifIdx=i;
  renderSesi(i);
}

function renderSesi(si){
  const el=document.getElementById('tab-sesi');if(!el)return;
  const sesiNama=SESI[si];
  // _absensiTglPilih berformat yyyy-mm-dd (dari <input type="date">).
  // tglKey = kunci kanonik (dipakai untuk MENYIMPAN record baru, selalu
  // sama persis di semua HP). tglLegacy = format lama (toLocaleDateString
  // 'id-ID'), dicek juga sebagai fallback supaya absensi yang sudah
  // tersimpan sebelum perbaikan ini tidak hilang dari tampilan.
  const [yy,mm,dd]=_absensiTglPilih.split('-').map(Number);
  const tglKey=tglKanon(yy,mm,dd);
  const tglLegacy=tglLegacyID(yy,mm,dd);
  const tglTampil=new Date(yy,mm-1,dd).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  const isHariIni=_absensiTglPilih===todayLocalInputDate();
  const isEditor=C.absensi_edit(R);
  const cariRec=(aid)=>D.absensi.find(x=>x.anggotaId===aid&&x.sesi===si&&(x.tgl===tglKey||x.tgl===tglLegacy));

  let html=`<div class="sec">${sesiNama} — ${tglTampil}${isHariIni?'':' <span style="font-size:11px;color:var(--warn);font-weight:400">(bukan hari ini)</span>'}</div>`;
  if(isEditor){
    html+=`<div class="card">`;
    D.anggota.filter(a=>['pps_aktif','pps_senior','balonpas'].includes(a.role)&&a.status==='aktif').forEach(a=>{
      const rec=cariRec(a.id);
      const v=rec?.status||'hadir';
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <div><div style="font-weight:600;font-size:13px">${esc(a.nama)}</div><div style="font-size:11px;color:var(--fg2)">${esc(a.kelas||'-')}</div></div>
        <select onchange="setAbsensi('${a.id}',${si},'${tglKey}',this.value)" style="padding:4px 8px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg);font-size:12px">
          <option value="hadir"${v==='hadir'?' selected':''}>Hadir</option>
          <option value="alfa"${v==='alfa'?' selected':''}>Alfa</option>
          <option value="izin"${v==='izin'?' selected':''}>Izin</option>
          <option value="sakit"${v==='sakit'?' selected':''}>Sakit</option>
        </select></div>`;
    });
    html+=`</div>`;
  } else if(C.isAnggota(R)||C.isPengurus(R)){
    // Anggota/balonpas/pengurus (Pembina, Pelatih, Ketua, dll) lihat rekap absensi semua (read-only)
    html+=`<div class="card"><div class="card-title" style="font-size:13px">📋 Data Absensi ${sesiNama}</div>`;
    D.anggota.filter(a=>['pps_aktif','pps_senior','balonpas'].includes(a.role)&&a.status==='aktif').forEach(a=>{
      const rec=cariRec(a.id);
      const v=rec?.status||'-';
      const badge=v==='hadir'?'badge-ok':v==='alfa'?'badge-danger':v==='izin'?'badge-info':v==='sakit'?'badge-warn':'';
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:13px">${esc(a.nama)}</div>
        <span class="badge ${badge}">${v.toUpperCase()}</span></div>`;
    });
    html+=`</div><div class="alert alert-warn" style="font-size:12px">Absensi hanya bisa diubah oleh Sekretaris.</div>`;
  } else {
    html+='<div class="alert alert-warn">Hanya Sekretaris yang dapat mengedit absensi.</div>';
  }
  el.innerHTML=html;
}

function setAbsensi(aid,si,tgl,status){
  let rec=D.absensi.find(x=>x.anggotaId===aid&&x.sesi===si&&x.tgl===tgl);
  if(rec) rec.status=status;
  else D.absensi.push({id:uid(),anggotaId:aid,sesi:si,tgl,status});
  // hitung alfa
  const a=D.anggota.find(x=>x.id===aid);
  if(a){
    a.totalAlfa=D.absensi.filter(x=>x.anggotaId===aid&&x.status==='alfa').length;
    a.totalIzin=D.absensi.filter(x=>x.anggotaId===aid&&x.status==='izin').length;
  }
  save();toast('Absensi disimpan');
}

function getAnggotaMelebihi(){
  return D.anggota.filter(a=>a.totalAlfa>=3);
}

// ── Pembinaan Khusus: anggota dengan alfa tanpa izin berulang (≥3×) dan/atau
// akumulasi poin pelanggaran Tatib yang tinggi (≥10 poin) disarankan masuk
// daftar ini untuk ditindaklanjuti serius oleh Pembina/Pelatih/TATIB. ──
const AMBANG_POIN_PEMBINAAN_KHUSUS=10;
function poinPelanggaranAnggota(aid){
  return D.pelanggaran.filter(p=>p.anggotaId===aid&&p.status!=='aduan').reduce((s,p)=>s+(p.poin||0),0);
}
function statusPembinaanKhususAnggota(aid){
  const aktif=D.pembinaanKhusus.filter(x=>x.anggotaId===aid&&x.status==='aktif');
  return aktif.length?aktif[aktif.length-1]:null;
}
function getAnggotaDisarankanPembinaanKhusus(){
  return D.anggota.filter(a=>{
    if(a.status!=='aktif')return false;
    if(statusPembinaanKhususAnggota(a.id))return false; // sudah aktif dibina, tak perlu disarankan lagi
    const alfa=a.totalAlfa||0;
    const poin=poinPelanggaranAnggota(a.id);
    return alfa>=3||poin>=AMBANG_POIN_PEMBINAAN_KHUSUS;
  });
}
function modalTambahPembinaanKhusus(anggotaId){
  const a=anggotaId?D.anggota.find(x=>x.id===anggotaId):null;
  const alfa=a?(a.totalAlfa||0):0;
  const poin=a?poinPelanggaranAnggota(a.id):0;
  openModal(`<div class="modal-title">+ Masukkan ke Pembinaan Khusus <button class="modal-close" onclick="closeModal()">×</button></div>
  <div class="field"><label>Nama Anggota</label>
    <select id="pk-nama">
      <option value="">-- Pilih --</option>
      ${D.anggota.filter(x=>x.status==='aktif').map(x=>`<option value="${x.id}"${a&&a.id===x.id?' selected':''}>${esc(x.nama)} (${RLBL[x.role]||x.role})</option>`).join('')}
    </select>
  </div>
  ${a?`<div style="font-size:12px;color:var(--fg2);margin:-4px 0 10px">Alfa tanpa izin: ${alfa}× · Poin pelanggaran Tatib: ${poin}</div>`:''}
  <div class="field"><label>Alasan Dimasukkan ke Pembinaan Khusus</label><textarea id="pk-alasan" placeholder="Contoh: 3x alfa tanpa izin berturut-turut dan beberapa kali melanggar Tatib">${a?`${alfa>=3?alfa+'x alfa tanpa izin. ':''}${poin>=AMBANG_POIN_PEMBINAAN_KHUSUS?'Akumulasi poin pelanggaran Tatib: '+poin+'. ':''}`:''}</textarea></div>
  <button class="btn btn-primary btn-full" onclick="simpanPembinaanKhusus()">💾 Masukkan ke Pembinaan Khusus</button>`);
}
function simpanPembinaanKhusus(){
  const anggotaId=document.getElementById('pk-nama').value;

  html+=`<div class="sec" style="margin-top:10px;font-size:13px">📋 Sedang Dibina (${aktif.length})</div>`;
  if(!aktif.length)html+='<div style="color:var(--fg3);font-size:13px">Tidak ada anggota di Pembinaan Khusus saat ini.</div>';
  aktif.slice().reverse().forEach(pk=>{
    html+=`<div class="item" style="border-left:4px solid var(--danger)">

function renderRekapAnggota(){
  const melebihi=getAnggotaMelebihi();
  let html=`<div class="sec">⚠️ Anggota Melewati Batas (≥3 Alfa)</div>`;
  if(!melebihi.length) html+='<div class="alert alert-ok">✅ Semua anggota masih dalam batas toleransi.</div>';
  else melebihi.forEach(a=>{
    const poin=D.pelanggaran.filter(p=>p.anggotaId===a.id).reduce((s,p)=>s+(p.poin||0),0);
    html+=`<div class="rekap-item"><div style="font-weight:700">${esc(a.nama)}</div><div style="font-size:12px;color:var(--fg2)">${RLBL[a.role]||a.role} · ${esc(a.kelas||'-')}</div><div style="margin-top:6px;display:flex;gap:8px"><span class="badge badge-danger">Alfa: ${a.totalAlfa||0}×</span><span class="badge badge-warn">Izin: ${a.totalIzin||0}×</span><span class="badge badge-info">Poin Pelanggaran: ${poin}</span></div></div>`;
  });

  html+=`<div class="sec">📊 Statistik Absensi</div>`;
  D.anggota.filter(a=>a.status==='aktif').forEach(a=>{
    const bar=Math.min(100,((a.totalAlfa||0)/3)*100);
    html+=`<div class="item"><div class="item-head"><div><div class="item-title">${esc(a.nama)}</div><div class="item-sub">${RLBL[a.role]||a.role}</div></div></div>
    <div style="margin-top:8px"><div class="gauge-row"><div class="gauge-label">Alfa</div><div class="gauge-bar"><div class="gauge-fill" style="width:${bar}%;background:var(--danger)"></div></div><div class="gauge-val">${a.totalAlfa||0}</div></div></div></div>`;

}

function renderIzin(){
  let html='';
  const isAcc=C.proker_acc(R);

  // Form pengajuan izin
  if(C.isAnggota(R)){
    // Balonpas, PPS Aktif, dan PPS Senior cuma boleh ajukan izin hari Rabu —
    // Capas tidak dibatasi hari.
    const hariIni=new Date().getDay(); // 0=Minggu, 3=Rabu
    const isRabu=hariIni===3;
    const butuhRabu=RABU_ONLY_ROLES.includes(R);
    if(butuhRabu&&!isRabu){
      const namaPeran=R==='balonpas'?'Balonpas':RLBL[R].replace(/^\S+\s/,'');
      html+=`<div class="sec">📝 Izin ${namaPeran}</div>
      <div class="alert alert-warn">⛔ ${namaPeran} hanya bisa mengajukan izin pada <strong>hari Rabu</strong>. Hari ini bukan Rabu — pengajuan izin tidak tersedia.</div>`;
    } else {
      const fotowajib=R==='balonpas';
      html+=`<div class="sec">📝 Ajukan Izin${R==='balonpas'?' (Rabu — Wajib Foto Bukti)':butuhRabu?' (Rabu)':''}</div>
      <div class="card">
        ${R==='balonpas'?'<div class="alert alert-warn" style="font-size:12px;margin-bottom:10px">⚠️ Izin balonpas wajib disertai foto bukti. Izin akan diteruskan ke Pengurus Inti → Pembina untuk disetujui.</div>':''}
        <div class="field"><label>Nama</label><input id="iz-nama" placeholder="Nama lengkap Anda"></div>
        <div class="field"><label>Tanggal</label><input id="iz-tgl" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="field"><label>Sesi</label><select id="iz-sesi">${SESI.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select></div>
        <div class="field"><label>Jenis Alasan</label><select id="iz-jenis">
          <option>Sakit</option>
          <option>Keperluan Keluarga</option>
          <option>Kegiatan/Tugas Sekolah Lain</option>
          <option>Kepentingan Mendesak Lainnya</option>
        </select></div>
        <div class="field"><label>Jelaskan Alasan Anda <span style="color:var(--fg3);font-weight:400">(wajib jelas & masuk akal, minimal ±15 karakter)</span></label><textarea id="iz-alasan" placeholder="Contoh: Sakit demam sejak semalam, sudah periksa ke puskesmas pagi ini, surat dokter terlampir."></textarea></div>
        <div class="field"><label>Foto Bukti${fotowajib?' <span style="color:var(--danger)">*WAJIB</span>':' (opsional, disarankan dilampirkan untuk memperkuat alasan — misal surat dokter, bukti kegiatan, dsb)'}</label><input type="file" id="iz-foto" accept="image/*" onchange="prevIzinFoto(this)"><img id="iz-foto-prev" class="photo-prev" style="display:none"></div>
        <button class="btn btn-primary btn-full" onclick="ajukanIzin()">📤 Ajukan Izin</button>
      </div>`;
    }
  }

  // Daftar izin — pengurus inti lihat pending_pi, pembina lihat pending_pembina.
  // Izin Balonpas/PPS Aktif/PPS Senior (RABU_ONLY_ROLES): keputusan akhir (Setujui/Tolak)
  // hanya boleh dilakukan Pembina — Pelatih & Pengurus Inti hanya bisa melihat/meneruskan.
  const isPengurusInti=['ketua','sekretaris','bendahara','tatib','aspelatih1','aspelatih2'].includes(R);
  const isPembinaOrPelatih=['pembina','pelatih'].includes(R);
  const isPembina=R==='pembina';
  if(isPengurusInti||isPembinaOrPelatih){
    html+=`<div class="sec">📋 Daftar Pengajuan Izin</div>
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <div class="field" style="flex:1;min-width:140px;margin:0"><label>Tampilkan</label>
        <select id="izin-filter" onchange="pilihFilterIzin(this.value)">
          <option value="minggu"${_izinFilter==='minggu'?' selected':''}>7 Hari Terakhir</option>
          <option value="bulan"${_izinFilter==='bulan'?' selected':''}>30 Hari Terakhir</option>
          <option value="semua"${_izinFilter==='semua'?' selected':''}>Semua (Riwayat Lengkap)</option>
        </select>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="downloadIzinCSV()" style="align-self:flex-end">⬇️ Unduh Rekap CSV</button>
    </div>`;
    const batas=rentangTanggalIzin(_izinFilter);
    const semuaIzin=D.izin.slice().reverse();
    const sedangProses=iz=>['pending','pending_pi','pending_pembina'].includes(iz.status);
    const daftar=semuaIzin.filter(iz=>sedangProses(iz)||!batas||new Date(iz.tgl)>=batas);
    const jumlahDisembunyikan=semuaIzin.length-daftar.length;
    if(!daftar.length) html+='<div style="color:var(--fg3);font-size:13px;padding:12px 0">Belum ada pengajuan izin.</div>';
    if(jumlahDisembunyikan>0) html+=`<div style="color:var(--fg3);font-size:12px;padding:4px 0 10px">ℹ️ ${jumlahDisembunyikan} riwayat izin lama disembunyikan dari tampilan ini (tetap tersimpan — pilih "Semua" atau unduh CSV untuk melihat/merekap semuanya).</div>`;
    daftar.forEach(iz=>{
      const stLabel={'acc':'✅ DISETUJUI','tolak':'❌ DITOLAK','pending':'⏳ MENUNGGU','pending_pi':'📋 MENUNGGU PI','pending_pembina':'📤 MENUNGGU PEMBINA'}[iz.status]||iz.status.toUpperCase();
      const st=iz.status==='acc'?'badge-ok':iz.status==='tolak'?'badge-danger':'badge-warn';
      const butuhPembinaSaja=RABU_ONLY_ROLES.includes(iz.role);
      const bolehAccTolakFinal=butuhPembinaSaja?isPembina:(isPengurusInti||isPembinaOrPelatih);
      html+=`<div class="item"><div class="item-head"><div><div class="item-title">${esc(iz.nama)}</div><div class="item-sub">${SESI[iz.sesi]||iz.sesi} · ${tgl(iz.tgl)}</div></div><span class="badge ${st}">${stLabel}</span></div>
      <div style="font-size:13px;margin-top:6px;color:var(--fg2)">${esc(iz.alasan)}</div>
      ${iz.foto?`<img src="${iz.foto}" class="photo-prev">`:''}
      ${iz.status==='pending_pi'&&isPengurusInti?`<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-ok btn-sm" onclick="accIzin('${iz.id}','pending_pembina')">📤 Teruskan ke Pembina</button><button class="btn btn-warn btn-sm" onclick="accIzin('${iz.id}','tolak')">✗ Tolak</button></div>`:''}
      ${iz.status==='pending_pembina'&&butuhPembinaSaja&&!isPembina?`<div style="margin-top:8px;font-size:12px;color:var(--fg3)">⏳ Menunggu keputusan Pembina (khusus ${RLBL[iz.role]||iz.role}, hanya Pembina yang bisa menyetujui/menolak).</div>`:''}
      ${iz.status==='pending_pembina'&&bolehAccTolakFinal?`<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-ok btn-sm" onclick="accIzin('${iz.id}','acc')">✓ Setujui</button><button class="btn btn-primary btn-sm" onclick="accIzin('${iz.id}','tolak')">✗ Tolak</button></div>`:''}
      ${iz.status==='pending'&&bolehAccTolakFinal?`<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-ok btn-sm" onclick="accIzin('${iz.id}','acc')">✓ Setujui</button><button class="btn btn-primary btn-sm" onclick="accIzin('${iz.id}','tolak')">✗ Tolak</button></div>`:''}
      </div>`;
    });
  }

  // Anggota lihat status izin mereka sendiri
  if(!isAcc&&(C.isAnggota(R)||R==='balonpas')){
    html+=`<div class="sec">📋 Riwayat Izin Saya</div>`;
    // Tampilkan semua (tidak ada filter nama karena single-device)
    D.izin.slice().reverse().slice(0,5).forEach(iz=>{
      const st=iz.status==='acc'?'badge-ok':iz.status==='tolak'?'badge-danger':'badge-warn';
      html+=`<div class="item"><div class="item-head"><div class="item-title">${esc(iz.nama)} · ${SESI[iz.sesi]}</div><span class="badge ${st}">${iz.status.toUpperCase()}</span></div><div style="font-size:12px;color:var(--fg2)">${tgl(iz.tgl)}</div></div>`;
    });
  }
  return html;
}

// Kompres foto otomatis: resize max 480px, kualitas 0.55 → ~15-30KB
function kompressFoto(file,cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=480;
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}
      else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.55));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function prevIzinFoto(inp){
  const f=inp.files[0];if(!f)return;
  kompressFoto(f,data=>{const img=document.getElementById('iz-foto-prev');img.src=data;img.style.display='block';});
}
function ajukanIzin(){
  const nama=document.getElementById('iz-nama')?.value.trim();
  if(!nama)return toast('Nama harus diisi');
  const jenisEl=document.getElementById('iz-jenis');
  const jenis=jenisEl?jenisEl.value:'';
  const detail=document.getElementById('iz-alasan')?.value.trim();
  if(!detail)return toast('Alasan harus diisi');
  // Validasi kejelasan: wajib penjelasan yang cukup rinci, bukan cuma 1-2 kata,
  // supaya alasan izin logis dan bisa dinilai jelas oleh yang memeriksa.
  if(detail.length<15)return toast('⚠️ Alasan terlalu singkat. Jelaskan lebih rinci dan jelas (minimal ±15 karakter), misal kapan, kenapa, dan kondisinya.');
  const alasan=jenis?`${jenis} — ${detail}`:detail;
  const foto=document.getElementById('iz-foto-prev')?.src||null;
  const fotoData=foto&&foto.startsWith('data:')?foto:null;
  if(R==='balonpas'&&!fotoData)return toast('Balonpas wajib upload foto bukti izin');
  // Status approval chain:
  // - balonpas → pending_pi (pengurus inti teruskan) → pending_pembina (HANYA Pembina yang acc/tolak)
  // - pps_aktif & pps_senior → langsung pending_pembina (HANYA Pembina yang acc/tolak)
  // - peran lain (capas, dll) → pending (Pengurus Inti/Pembina/Pelatih boleh acc/tolak)
  const statusAwal=R==='balonpas'?'pending_pi':(RABU_ONLY_ROLES.includes(R)?'pending_pembina':'pending');
  D.izin.push({id:uid(),nama,role:R,tgl:document.getElementById('iz-tgl').value,sesi:parseInt(document.getElementById('iz-sesi').value),alasan,foto:fotoData,status:statusAwal,tglAjuan:Date.now()});
  save();toast(R==='balonpas'?'Izin diajukan ke Pengurus Inti':(RABU_ONLY_ROLES.includes(R)?'Izin diajukan, menunggu persetujuan Pembina':'Izin diajukan, menunggu persetujuan'));
  document.getElementById('iz-nama').value='';document.getElementById('iz-alasan').value='';
}
function accIzin(id,status){
  const iz=D.izin.find(x=>x.id===id);if(!iz)return;
  iz.status=status;save();toast(status==='acc'?'Izin disetujui':'Izin ditolak');renderAnggota();
}
// Rekap lengkap seluruh riwayat izin (tidak terpengaruh filter tampilan) — biar data
// tetap bisa direkap meski daftar di layar disaring agar rapi.
function downloadIzinCSV(){
  if(!D.izin.length)return toast('Belum ada data izin untuk direkap');
  const stLabel={'acc':'Disetujui','tolak':'Ditolak','pending':'Menunggu','pending_pi':'Menunggu PI','pending_pembina':'Menunggu Pembina'};
  let csv='Nama,Peran,Tanggal Izin,Sesi,Alasan,Status,Diajukan Pada\n';
  D.izin.slice().reverse().forEach(iz=>{
    const row=[iz.nama,RLBL[iz.role]||iz.role,tgl(iz.tgl),SESI[iz.sesi]||iz.sesi,iz.alasan,stLabel[iz.status]||iz.status,jamTgl(iz.tglAjuan)];
    csv+=row.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`rekap_izin_${todayLocalInputDate()}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('📥 Rekap izin diunduh ('+D.izin.length+' data)');
}

function bacaDokumenProker(inp){
  const file=inp.files[0];if(!file)return;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  toast('⏳ Membaca dokumen...');
  if(ext==='docx'){
    const reader=new FileReader();
    reader.onload=e=>{
      mammoth.extractRawText({arrayBuffer:e.target.result}).then(res=>{
        isiProkerDariDokumen(res.value,file.name);
      }).catch(err=>toast('Gagal membaca Word: '+err.message));
      inp.value='';
    };
    reader.readAsArrayBuffer(file);
  } else if(ext==='pdf'){
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const pdf=await pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise;
        let teks='';
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          let lastY=null,baris='';
          content.items.forEach(it=>{
            if(lastY!==null&&Math.abs(it.transform[5]-lastY)>4){baris+='\n';}
            baris+=it.str+' ';
            lastY=it.transform[5];
          });
          teks+=baris+'\n';
        }
        isiProkerDariDokumen(teks,file.name);
      }catch(err){toast('Gagal membaca PDF: '+err.message);}
      inp.value='';
    };
    reader.readAsArrayBuffer(file);
  } else if(ext==='xlsx'||ext==='xls'){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const teks=rows.map(r=>r.join(' | ')).join('\n');
        isiProkerDariDokumen(teks,file.name);
      }catch(err){toast('Gagal membaca Excel: '+err.message);}
      inp.value='';
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Format tidak didukung untuk dibaca otomatis. Gunakan .docx, .xlsx, atau .pdf');
    inp.value='';
  }
}
// Isi hasil baca dokumen ke form Proker — hanya TEKS yang disimpan (bukan file
// mentah), jadi ukurannya kecil dan tidak membebani kapasitas cloud seperti
// melampirkan dokumen aslinya.
function isiProkerDariDokumen(teks,namaFile){
  const bersih=teks.split('\n').map(l=>l.trim()).filter(Boolean).join('\n');
  if(!bersih)return toast('Tidak ada teks yang bisa dibaca dari file ini');
  const isiEl=document.getElementById('pk-isi');
  const judulEl=document.getElementById('pk-judul');
  if(isiEl)isiEl.value=bersih;
  if(judulEl&&!judulEl.value.trim()){
    const baris1=bersih.split('\n')[0]||'';
    if(baris1&&baris1.length<=120)judulEl.value=baris1;
  }
  toast('✅ Isi dokumen "'+namaFile+'" berhasil dibaca — cek & rapikan di kolom Isi/Deskripsi');
}
function simpanProker(sbgDraft){
  const j=document.getElementById('pk-judul').value.trim();
  if(!j&&!sbgDraft)return toast('Judul harus diisi');
  if(!j&&sbgDraft)return toast('Isi judul dulu (boleh sementara/belum pasti) sebelum disimpan sebagai draft');
  const fileInp=document.getElementById('pk-file');
  const file=fileInp&&fileInp.files[0];
  const existing=_prokerEditId?D.proker.find(x=>x.id===_prokerEditId):null;
  const dataBaru=existing?{...existing}:{id:uid(),accPembina:false,accPelatih:false,dibuatOleh:RLBL[R]};
  dataBaru.judul=j;dataBaru.jenis=document.getElementById('pk-jenis').value;dataBaru.tgl=document.getElementById('pk-tgl').value;dataBaru.isi=document.getElementById('pk-isi').value.trim();dataBaru.draft=!!sbgDraft;
  if(file){
    // Batas realistis: cloud (lihat BATAS_CLOUD_KIRIM) menampung SELURUH data
    // aplikasi, bukan per-proker. Jadi batas lampiran harus dihitung dari sisa
    // ruang yang benar-benar ada sekarang, bukan angka tetap — sebelumnya
    // dipatok 400KB padahal sisa ruang bisa jauh lebih kecil, dan itulah sebab
    // lampiran bikin Proker gagal tersimpan tanpa pemberitahuan.
    const sisaRuang=(BATAS_CLOUD_KIRIM-50000)-JSON.stringify(D).length; // sisakan jarak aman
    const maxRawBytes=Math.max(0,Math.floor(sisaRuang*0.7)); // base64 menggembungkan ~1.37x
    if(sisaRuang<2000){
      toast('⚠️ Data cloud sudah hampir penuh (lihat Pengaturan → Sinkron → Cek Status Sinkron). Lampiran TIDAK bisa disimpan sampai ada ruang tersisa. Proker tetap disimpan tanpa lampiran.');
      finishSimpanProker(dataBaru);
      return;
    }
    if(file.size>maxRawBytes){
      toast('⚠️ File lampiran maksimal ±'+Math.floor(maxRawBytes/1024)+'KB saat ini (sisa ruang cloud terbatas). Proker tetap disimpan tanpa lampiran.');
      finishSimpanProker(dataBaru);
      return;
    }
    const reader=new FileReader();
    reader.onload=e=>{
      dataBaru.lampiran=e.target.result;
      dataBaru.lampiranNama=file.name;
      finishSimpanProker(dataBaru);
    };
    reader.readAsDataURL(file);
    return;
  }
  finishSimpanProker(dataBaru);
}
function finishSimpanProker(dataBaru){
  const idx=D.proker.findIndex(x=>x.id===dataBaru.id);
  if(idx>=0)D.proker[idx]=dataBaru;else D.proker.push(dataBaru);
  const pesan=dataBaru.draft?'💾 Draft disimpan — lanjutkan nanti dari menu Proker':'Proker diajukan, menunggu persetujuan';
  _prokerEditId=null;
  save();closeModal();toast(pesan);renderTabKegiatan('proker');
}

// TTD pada proker
function ttdProker(pid){
  if(!D.ttd){
    openModal(`<div class="modal-title">Tanda Tangan Digital <button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:13px;color:var(--fg2);margin-bottom:12px">Anda belum memiliki tanda tangan tersimpan. Buat sekarang:</p>

      <button class="btn btn-primary btn-sm btn-full" onclick="saveTTD('${pid}')">💾 Simpan & Tanda Tangani</button>
    </div>`);
    initTTDCanvas();
  } else {
    // TTD sudah ada, langsung tempel

}
let ttdCtx,ttdDrawing=false,ttdPts=[];
function initTTDCanvas(){
  const c=document.getElementById('ttd-canvas');if(!c)return;
  ttdCtx=c.getContext('2d');
  ttdCtx.fillStyle='#fff';ttdCtx.fillRect(0,0,c.width,c.height);
  ttdCtx.strokeStyle='#000';
  ttdCtx.lineWidth=2;ttdCtx.lineCap='round';
  c.addEventListener('mousedown',e=>{ttdDrawing=true;ttdCtx.beginPath();ttdCtx.moveTo(e.offsetX,e.offsetY);});
  c.addEventListener('mousemove',e=>{if(!ttdDrawing)return;ttdCtx.lineTo(e.offsetX,e.offsetY);ttdCtx.stroke();});
  c.addEventListener('mouseup',()=>ttdDrawing=false);
  c.addEventListener('touchstart',e=>{e.preventDefault();ttdDrawing=true;const r=c.getBoundingClientRect();const t=e.touches[0];ttdCtx.beginPath();ttdCtx.moveTo(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(!ttdDrawing)return;const r=c.getBoundingClientRect();const t=e.touches[0];ttdCtx.lineTo(t.clientX-r.left,t.clientY-r.top);ttdCtx.stroke();},{passive:false});
  c.addEventListener('touchend',()=>ttdDrawing=false);
}
function clearTTD(){const c=document.getElementById('ttd-canvas');if(c){ttdCtx.clearRect(0,0,c.width,c.height);ttdCtx.fillStyle='#fff';ttdCtx.fillRect(0,0,c.width,c.height);}}
function saveTTD(pid){
  const c=document.getElementById('ttd-canvas');if(!c)return;
  D.ttd=c.toDataURL();save();closeModal();toast('TTD disimpan');
  if(pid) embedTTD(pid);
}
function embedTTD(pid){
  const p=D.proker.find(x=>x.id===pid);if(!p)return;
  p.ttd=D.ttd;p.ttdOleh=RLBL[R];p.ttdTgl=Date.now();
  save();toast('Dokumen berhasil ditandatangani');renderTabKegiatan('proker');
}

// REKOMENDASI KEGIATAN PER PERTEMUAN (dibaca & diuraikan dari isi Proker)
// ═══════════════════════════════════════════
// Kamus topik: kata kunci yang dicari di judul+isi proker, dan aktivitas
// konkret yang cocok untuk topik itu. Dipakai untuk "menguraikan" isi proker
// jadi arahan kegiatan per pertemuan, bukan sekadar menyalin teksnya.
const TOPIK_KEGIATAN={
  pbb:{label:'PBB & Formasi',kw:['pbb','baris','formasi','langkah','balik kanan','hadap','parade','pemetaan'],akt:[
    'Latihan baris-berbaris dasar: sikap sempurna, hadap kanan/kiri, balik kanan',
    'Latihan langkah tegap dan langkah biasa sesuai tempo (96 langkah/menit)',
    'Pemantapan formasi barisan sesuai pemetaan yang sudah ditentukan']},
  fisik:{label:'Fisik & Samapta',kw:['fisik','samapta','lari','push','stamina','kardio','kebugaran','pemanasan'],akt:[
    'Pemanasan dinamis 10–15 menit sebelum latihan inti',
    'Latihan samapta: lari, push-up, sit-up sesuai target angkatan',
    'Pendinginan dan peregangan statis di akhir sesi']},
  mental:{label:'Mental & Disiplin',kw:['mental','disiplin','kepemimpinan','karakter','motivasi','adab'],akt:[
    'Pembinaan mental dan motivasi oleh Pembina/Pelatih',
    'Simulasi di bawah tekanan (gladi dengan evaluasi langsung)',
    'Diskusi singkat soal kepemimpinan, adab, dan tanggung jawab anggota']},
  upacara:{label:'Teknik Upacara',kw:['upacara','pengibaran','bendera','voorijder','baki','pembawa'],akt:[
    'Latihan teknik pengibaran/penurunan bendera',
    'Latihan posisi dan peran masing-masing petugas upacara',
    'Gladi kotor tata upacara secara lengkap dari awal sampai akhir']},
  lomba:{label:'Persiapan Lomba/Seleksi',kw:['lomba','seleksi','lkbb','kompetisi','juara'],akt:[
    'Latihan sesuai kriteria penilaian lomba (variasi formasi, kekompakan, ketepatan aba-aba)',
    'Simulasi lomba dengan waktu dan penilaian seperti aslinya',
    'Evaluasi dari rekaman video latihan untuk perbaikan detail']},
  evaluasi:{label:'Evaluasi & Penilaian',kw:['evaluasi','penilaian','tes','ujian','rekap'],akt:[
    'Tes/evaluasi kemampuan individu dan kelompok',
    'Pencatatan hasil evaluasi sebagai bahan pembinaan lanjutan']},
  admin:{label:'Administrasi & Koordinasi',kw:['administrasi','rapat','proposal','surat','koordinasi'],akt:[
    'Rapat koordinasi panitia/pengurus terkait kegiatan',
    'Penyusunan administrasi dan surat-menyurat yang diperlukan']}
};
// Fase per jenis proker — urutan fokus dari pertemuan pertama ke terakhir.
const FASE_JENIS={
  'Latihan Rutin':['pbb','fisik','mental'],
  'Kegiatan Khusus':['admin','pbb','mental','evaluasi'],
  'Lomba/Seleksi':['evaluasi','pbb','lomba','mental'],
  'Upacara':['upacara','upacara','mental','upacara'],
  'Lainnya':['pbb','fisik','mental'],
  'Proposal':['admin','pbb','mental']
};
function deteksiTopikProker(p){
  const teks=((p.judul||'')+' '+(p.isi||'')+' '+(p.jenis||'')).toLowerCase();
  return Object.keys(TOPIK_KEGIATAN).filter(k=>TOPIK_KEGIATAN[k].kw.some(kw=>teks.includes(kw)));
}
// Daftar tanggal pertemuan (Rabu/Kamis/Sabtu, sesuai array SESI) antara hari
// ini sampai tanggal target proker. Dibatasi maksimal 8 pertemuan biar tidak
// kepanjangan kalau tanggal target masih jauh.
function daftarPertemuanProker(tglTarget){
  const hariSesi=[3,4,6]; // index SESI: 0=Rabu,1=Kamis,2=Sabtu -> getDay():3,4,6
  const today=new Date();today.setHours(0,0,0,0);
  let target=tglTarget?new Date(tglTarget):null;
  if(target)target.setHours(0,0,0,0);
  const lewat=target&&target<today;
  if(!target||lewat)target=new Date(today.getTime()+28*86400000); // fallback: rencanakan 4 minggu ke depan
  const list=[];
  let cur=new Date(today);
  let guard=0;
  while(cur<=target&&guard<120){
    const idx=hariSesi.indexOf(cur.getDay());
    if(idx>=0)list.push({tgl:new Date(cur),sesiIdx:idx,sesiNama:SESI[idx]});
    cur.setDate(cur.getDate()+1);guard++;
  }
  return {list:list.slice(0,8),lewatAtauKosong:lewat||!tglTarget};
}
function buatRekomendasiProker(p){
  const {list,lewatAtauKosong}=daftarPertemuanProker(p.tgl);
  const fase=FASE_JENIS[p.jenis]||FASE_JENIS['Lainnya'];
  const topikEkstra=deteksiTopikProker(p).filter(t=>!fase.includes(t));
  if(!list.length)return{rows:[],lewatAtauKosong};
  const rows=list.map((pt,i)=>{
    const faseIdx=Math.min(fase.length-1,Math.floor(i*fase.length/list.length));
    const topikKey=fase[faseIdx];
    const topik=TOPIK_KEGIATAN[topikKey];
    const aktivitas=topik.akt.slice(0,2).slice();
    // Selipkan 1 aktivitas dari topik tambahan yang terdeteksi di deskripsi,
    // bergilir per pertemuan, supaya isi proker benar-benar tercermin.
    if(topikEkstra.length){
      const ek=TOPIK_KEGIATAN[topikEkstra[i%topikEkstra.length]];
      aktivitas.push(ek.akt[0]);
    }
    return{tgl:pt.tgl,sesiNama:pt.sesiNama,fokus:topik.label,aktivitas};
  });
  return{rows,lewatAtauKosong};
}
function modalRekomendasiProker(pid){
  const p=D.proker.find(x=>x.id===pid);if(!p)return;
  const {rows,lewatAtauKosong}=buatRekomendasiProker(p);
  let body='';
  if(!rows.length){
    body='<div class="alert alert-warn">Belum bisa membuat rekomendasi — isi dulu tanggal rencana pada proker ini.</div>';
  } else {
    if(lewatAtauKosong)body+='<div class="alert alert-warn" style="margin-bottom:10px">Tanggal rencana proker ini sudah lewat atau belum pasti, jadi ini rekomendasi umum untuk 4 minggu ke depan sebagai acuan.</div>';
    body+='<p style="font-size:12px;color:var(--fg2);margin-bottom:10px">Diuraikan otomatis dari jenis & isi proker "'+esc(p.judul)+'":</p>';
    rows.forEach((row,i)=>{
      body+=`<div class="item" style="margin-bottom:8px">
        <div class="item-title" style="font-size:13px">Pertemuan ${i+1} · ${tgl(row.tgl)} · ${esc(row.sesiNama)}</div>
        <div style="font-size:12px;color:var(--fg2);margin:4px 0 6px"><b>Fokus:</b> ${esc(row.fokus)}</div>
        <ul style="margin:0 0 8px 18px;padding:0;font-size:13px">${row.aktivitas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
        ${C.agenda_buat(R)?`<button class="btn btn-ghost btn-sm" onclick="tambahAgendaDariRekom('${p.id}',${i})">+ Jadikan Agenda</button>`:''}
      </div>`;
    });
  }
  openModal(`<div class="modal-title">🧭 Rekomendasi Kegiatan <button class="modal-close" onclick="closeModal()">×</button></div>${body}
  ${rows.length&&C.agenda_buat(R)?`<button class="btn btn-primary btn-full" onclick="tambahSemuaAgendaDariRekom('${p.id}')">+ Jadikan Semua Agenda</button>`:''}`);
}
function tambahAgendaDariRekom(pid,i){
  const p=D.proker.find(x=>x.id===pid);if(!p)return;
  const {rows}=buatRekomendasiProker(p);
  const row=rows[i];if(!row)return;
  D.agenda.push({id:uid(),judul:p.judul+' — Pertemuan '+(i+1),tgl:row.tgl.toISOString().split('T')[0],waktu:'',tempat:row.sesiNama,keterangan:'Fokus: '+row.fokus+'\n'+row.aktivitas.map(a=>'• '+a).join('\n'),dibuatOleh:RLBL[R],dariProker:pid});
  save();toast('Ditambahkan ke Agenda');
}
function tambahSemuaAgendaDariRekom(pid){
  const p=D.proker.find(x=>x.id===pid);if(!p)return;
  const {rows}=buatRekomendasiProker(p);
  rows.forEach((row,i)=>{
    D.agenda.push({id:uid(),judul:p.judul+' — Pertemuan '+(i+1),tgl:row.tgl.toISOString().split('T')[0],waktu:'',tempat:row.sesiNama,keterangan:'Fokus: '+row.fokus+'\n'+row.aktivitas.map(a=>'• '+a).join('\n'),dibuatOleh:RLBL[R],dariProker:pid});
  });
  save();closeModal();toast(rows.length+' pertemuan ditambahkan ke Agenda');renderBeranda();
}

    </div>`;
    return h;
  }

  if(bisaKelola&&D.pelanggaran.length){
    html+=`<button class="btn btn-blue btn-sm" style="margin-bottom:12px" onclick="downloadPelanggaranCSV()">📥 Rekap Semua Pelanggaran (Excel/CSV)</button>`;
  }

  pelAktif.slice().reverse().forEach(p=>{html+=renderItemPel(p);});

  if(pelArsip.length){
    html+=`<div class="sec">🗄️ Arsip — Sudah Dihukum (${pelArsip.length})</div>`;
    pelArsip.slice().reverse().forEach(p=>{html+=renderItemPel(p);});
  }

  html+=`<div class="sec">📜 Daftar Adat & Jenis Pelanggaran</div>`;
  D.adat.forEach(a=>{
    html+=`<div class="item"><div class="item-head"><div><div class="item-title">${esc(a.jenis)}</div><div class="item-sub">Kode: ${esc(a.kode)} · Tindakan: ${esc(a.tindakan)}</div></div><span class="badge badge-danger">${a.poin} poin</span></div></div>`;
  });

  html+=renderPembinaanKhusus();
  return html;
}

function downloadPelanggaranCSV(){
  let csv='Tanggal Kejadian,Nama,Jenis Pelanggaran,Poin,Hukuman/Tindakan,Catatan,Status,Diajukan Oleh,Diarsipkan Oleh\n';
  const statusLbl={tercatat:'Aktif',aduan:'Aduan (belum diverifikasi)',diteruskan:'Diteruskan ke Pembina',terverifikasi:'Terverifikasi',menunggu_acc:'Menunggu ACC Pembina',selesai:'Selesai Dihukum (Arsip)'};
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  D.pelanggaran.slice().reverse().forEach(p=>{
    csv+=[q(p.waktuKejadian?jamTgl(p.waktuKejadian):tgl(p.tgl)),q(p.nama),q(p.jenis),q(p.poin),q(p.tindakan||''),q(p.catatan||''),q(statusLbl[p.status]||p.status||''),q(p.diajukanOleh||''),q(p.diselesaikanOleh||'')].join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`rekap_pelanggaran_paskibra_${new Date().toISOString().split('T')[0]}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('📥 Rekap pelanggaran diunduh');
}

// PEMETAAN
// Ubah hasil tes Samapta (angka mentah) jadi skor 1-5 relatif terhadap rekan seangkatan yang sudah pernah dites.
// Kenapa relatif (persentil), bukan patokan angka tetap: standar kelulusan PPI beda-beda tiap daerah/tahun,
// jadi yang paling jujur dan aman dipakai di sini adalah "seberapa unggul dibanding teman-temannya sendiri".
function samaptaLatestMap(){
  const m={};
  D.samapta.forEach(s=>{if(!m[s.nama]||s.tgl>m[s.nama].tgl)m[s.nama]=s;});
  return m;
}
function samaptaSkorObjektif(nama,latestMap){
  const all=Object.values(latestMap);
  const me=latestMap[nama];
  if(!me||all.length<2)return null;
  const persentil=(k,baik)=>{
    const v=me[k];if(v==null)return null;
    const lain=all.filter(a=>a.nama!==nama).map(a=>a[k]).filter(x=>x!=null);
    if(!lain.length)return null;
    const lebihBuruk=lain.filter(x=>baik==='tinggi'?x<v:x>v).length;
    return lebihBuruk/lain.length; // 0..1, 1 = paling unggul
  };
  const ps=[persentil('pushup','tinggi'),persentil('situp','tinggi'),persentil('shuttle','rendah')].filter(x=>x!=null);
  if(!ps.length)return null;
  const avg=ps.reduce((a,b)=>a+b,0)/ps.length;
  return Math.round((1+avg*4)*10)/10; // 0..1 -> skala 1..5
}
function skorGabungan(p,latestMap){
  const smScore=samaptaSkorObjektif(p.nama,latestMap);
  const fisikGab=smScore!=null?Math.round(((p.fisik+smScore)/2)*10)/10:p.fisik;
  const s=Math.round((p.pb+fisikGab+p.mental+p.disiplin+p.kepemimpinan+p.komunikasi)/6*10)/10;
  return {s,smScore,fisikGab};
}
function renderPemetaan(){
  let html='';
  if(C.pemetaan_edit(R)){
    html+=`<button class="btn btn-primary btn-sm" style="margin-bottom:12px" onclick="modalPemetaan()">+ Input / Update Penilaian</button>`;
  }

  const daftar=D.pemetaan;
  if(!daftar.length) html+='<div class="alert alert-warn">Belum ada data pemetaan kemampuan.</div>';

  const latestMap=samaptaLatestMap();

  if(daftar.length){
    const ranking=daftar.map(p=>{const g=skorGabungan(p,latestMap);return{p,...g};}).sort((a,b)=>b.s-a.s);
    html+=`<div class="sec">📊 Ranking Potensi Lulus PPI (Pemetaan + Samapta)</div>

function simpanPemetaan(){
