<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRAMANSABEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f4f0;--bg2:#fff;--fg:#1a1a1a;--fg2:#555;--fg3:#888;
  --accent:#bf2a20;--accent2:#0b2d6e;--gold:#b8870a;
  --ok:#157a44;--warn:#c97505;--danger:#bf2a20;
  --border:#ddd;--card:#fff;--nav:#fff;
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --r:12px;--rr:8px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111;--bg2:#1a1a1a;--fg:#f0ede8;--fg2:#aaa;--fg3:#666;
  --border:#333;--card:#1e1e1e;--nav:#1a1a1a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#111;--bg2:#1a1a1a;--fg:#f0ede8;--fg2:#aaa;--fg3:#666;
  --border:#333;--card:#1e1e1e;--nav:#1a1a1a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding-bottom:80px}
h1,h2,h3,.exo{font-family:'Exo 2',sans-serif}
img{max-width:100%}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{font-family:inherit}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;background:none;color:var(--fg3);font-size:10px;gap:2px;transition:.15s}
.nb.on{color:var(--accent)}
.nb svg{width:22px;height:22px}

/* HEADER */
#hdr{background:var(--accent2);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
#hdr img{width:44px;height:44px;border-radius:6px;object-fit:cover}
#hdr-text h1{font-size:18px;font-weight:900;letter-spacing:.5px}
#hdr-text p{font-size:11px;opacity:.8}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.role-badge{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}

/* SCREENS */
.screen{display:none;padding:12px 16px}
.screen.on{display:block}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

/* KOMANDO */
.komando-box{background:var(--accent);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px;animation:pulse-border 2s infinite}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(191,42,32,.4)}50%{box-shadow:0 0 0 8px rgba(191,42,32,0)}}
.komando-box h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-bottom:6px}
.komando-box p{font-size:15px;font-weight:600;line-height:1.5}
.komando-box .kmeta{font-size:11px;opacity:.7;margin-top:6px}
.pengumuman-box{background:var(--accent2);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px}
.pengumuman-box h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.8;margin-bottom:5px}

/* FORMS */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rr);background:var(--bg);color:var(--fg);font-size:14px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}

/* BUTTONS */
.btn{padding:11px 20px;border-radius:var(--rr);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-blue{background:var(--accent2);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%;justify-content:center}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-ok{background:#d4edda;color:var(--ok)}
.badge-warn{background:#fff3cd;color:var(--warn)}
.badge-danger{background:#fde;color:var(--danger)}
.badge-info{background:#d1ecf1;color:#0a6c82}
.badge-grey{background:var(--border);color:var(--fg2)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
.badge-ok{background:#0d3321;color:#4ade80}
.badge-warn{background:#3a2500;color:#fbbf24}
.badge-danger{background:#3a0a0a;color:#f87171}
.badge-info{background:#0a2030;color:#67e8f9}
}}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:14px;gap:0;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--fg3);background:none;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* LISTS */
.item{background:var(--card);border-radius:var(--rr);padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-title{font-weight:600;font-size:14px}
.item-sub{font-size:12px;color:var(--fg2);margin-top:3px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-box{background:var(--card);border-radius:var(--rr);padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-box .n{font-size:24px;font-weight:900;font-family:'Exo 2',sans-serif}
.stat-box .l{font-size:11px;color:var(--fg2);margin-top:2px}

/* SECTION TITLE */
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);margin:16px 0 8px}

/* ALERT */
.alert{padding:10px 14px;border-radius:var(--rr);font-size:13px;margin-bottom:10px}
.alert-warn{background:#fff3cd;color:#7a4800;border-left:3px solid var(--warn)}
.alert-danger{background:#fde;color:#7a0000;border-left:3px solid var(--danger)}
.alert-ok{background:#d4edda;color:#0d3321;border-left:3px solid var(--ok)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
.alert-warn{background:#3a2500;color:#fbbf24}
.alert-danger{background:#3a0a0a;color:#f87171}
.alert-ok{background:#0d3321;color:#4ade80}
}}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;font-family:'Exo 2',sans-serif}
.modal-close{float:right;background:none;color:var(--fg2);font-size:20px;line-height:1}

/* TTD CANVAS */
#ttd-canvas{border:2px dashed var(--border);border-radius:var(--rr);touch-action:none;width:100%;height:160px;cursor:crosshair}

/* PEMETAAN GAUGE */
.gauge-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gauge-label{width:80px;font-size:12px;color:var(--fg2)}
.gauge-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.gauge-fill{height:100%;background:var(--accent);border-radius:4px;transition:.4s}
.gauge-val{width:28px;text-align:right;font-size:12px;font-weight:700}

/* REKAP ALERT */
.rekap-item{background:var(--card);border-radius:var(--rr);padding:12px;margin-bottom:8px;border-left:4px solid var(--danger)}

/* PHOTO PREVIEW */
.photo-prev{width:100%;max-height:200px;object-fit:cover;border-radius:var(--rr);margin-top:8px}

/* RING */
.ring{display:inline-block;width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--accent2)}
#login-screen h1{color:#fff;font-size:28px;font-weight:900;text-align:center;margin-top:12px}
#login-screen p{color:rgba(255,255,255,.75);font-size:13px;text-align:center;margin-top:4px;margin-bottom:28px}
.login-card{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px}
.role-btn{width:100%;padding:11px 14px;border-radius:var(--rr);background:var(--bg);color:var(--fg);font-size:14px;font-weight:600;text-align:left;border:1.5px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:10px;transition:.15s}
.role-btn:hover{border-color:var(--accent);color:var(--accent)}
.role-btn .ri{font-size:20px}

/* KEUANGAN */
.kas-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.kas-item:last-child{border:none}

/* SHARE BTN WA */
.wa-btn{background:#25D366;color:#fff;border-radius:var(--rr);padding:10px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <img src="/mnt/user-data/attachments/eb789ca2-4628-54ed-b40c-e4b8a65aae38/cab12fb6-image.jpg" width="90" height="90" style="border-radius:12px;object-fit:cover" onerror="this.style.display='none'">
  <h1>PRAMANSABEL</h1>
  <p>Manajemen PASKIBRA MAN 1 Belitung</p>
  <div class="login-card">
    <p style="font-size:13px;color:#555;margin-bottom:12px;font-weight:600">Pilih peran Anda:</p>
    <div id="role-list"></div>
  </div>
</div>

<!-- HEADER -->
<div id="hdr" style="display:none">
  <img src="/mnt/user-data/attachments/eb789ca2-4628-54ed-b40c-e4b8a65aae38/cab12fb6-image.jpg" onerror="this.style.display='none'" style="width:40px;height:40px;border-radius:6px">
  <div id="hdr-text">
    <h1 class="exo" style="font-size:17px">PRAMANSABEL</h1>

  <div id="hdr-right">
    <span id="role-badge" class="role-badge"></span>

</div>

<!-- SCREENS -->
<div id="s-beranda" class="screen"></div>
<div id="s-anggota" class="screen"></div>
<div id="s-kegiatan" class="screen"></div>
<div id="s-laporan" class="screen"></div>
<div id="s-pengaturan" class="screen"></div>

<!-- BOTTOM NAV -->
<nav id="nav" style="display:none"></nav>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODAL OVERLAY -->
<div id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-body" onclick="e=>e.stopPropagation()"></div>
</div>

<script>
// ═══════════════════════════════════════════
// DATA STORE
// ═══════════════════════════════════════════
const SK = 'pramansabel_v3';
const PIN_ROLES=['pembina','pelatih','aspelatih1','aspelatih2','ketua','sekretaris','bendahara','tatib'];
let _pinBuf='';let _pinTarget='';let _pinCb=null;let _pinMode='check';let _pinNewBuf='';

function hashPin(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h|=0;}return h.toString(36);}
function getPins(){try{return JSON.parse(localStorage.getItem('pramansabel_pins')||'{}');}catch{return{};}}
function savePins(o){try{localStorage.setItem('pramansabel_pins',JSON.stringify(o));}catch{}}
function hasPin(role){return !!getPins()[role];}

function openPinModal(role, mode, cb){
  _pinBuf='';_pinNewBuf='';_pinTarget=role;_pinCb=cb;_pinMode=mode;
  document.getElementById('pin-role-label').textContent=RLBL[role]||role;
  document.getElementById('pin-desc').textContent=mode==='set'?'Buat PIN baru (4 digit) untuk role ini':mode==='change'?'Masukkan PIN lama terlebih dahulu':'Masukkan PIN untuk mengakses role ini';
  document.getElementById('pin-err').textContent='';
  updatePinDots();
  document.getElementById('pin-overlay').style.display='flex';
}
function cancelPin(){document.getElementById('pin-overlay').style.display='none';_pinBuf='';_pinCb=null;}
function updatePinDots(){
  document.querySelectorAll('#pin-dots .pd').forEach((d,i)=>d.classList.toggle('filled',i<_pinBuf.length));
}
function pinKey(k){
  if(k==='←'){_pinBuf=_pinBuf.slice(0,-1);updatePinDots();document.getElementById('pin-err').textContent='';return;}
  if(k==='✓'){
    if(_pinBuf.length<4){document.getElementById('pin-err').textContent='PIN harus 4 digit';return;}
    submitPin();return;
  }
  if(_pinBuf.length>=4)return;
  _pinBuf+=String(k);
  updatePinDots();
}
function submitPin(){
  const pins=getPins();
  if(_pinMode==='set'){
    if(!_pinNewBuf){_pinNewBuf=_pinBuf;_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Ulangi PIN baru untuk konfirmasi';document.getElementById('pin-err').textContent='';return;}
    if(_pinBuf!==_pinNewBuf){document.getElementById('pin-err').textContent='PIN tidak cocok, coba lagi';_pinBuf='';_pinNewBuf='';updatePinDots();return;}
    pins[_pinTarget]=hashPin(_pinBuf);savePins(pins);
    document.getElementById('pin-overlay').style.display='none';_pinBuf='';_pinNewBuf='';
    toast('PIN berhasil disimpan untuk '+RLBL[_pinTarget]);
    if(_pinCb)_pinCb(true);return;
  }
  if(_pinMode==='change'){
    if(!_pinNewBuf&&!pins[_pinTarget]){// no existing pin, treat as set
      _pinNewBuf=_pinBuf;_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Ulangi PIN baru';return;
    }
    if(!_pinNewBuf){// verify old pin first
      if(pins[_pinTarget]&&hashPin(_pinBuf)!==pins[_pinTarget]){document.getElementById('pin-err').textContent='PIN lama salah';_pinBuf='';updatePinDots();return;}
      _pinNewBuf='OLD_VERIFIED';_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Masukkan PIN baru (4 digit)';return;
    }
    if(_pinNewBuf==='OLD_VERIFIED'){_pinNewBuf=_pinBuf;_pinBuf='';updatePinDots();document.getElementById('pin-desc').textContent='Ulangi PIN baru';return;}
    if(_pinBuf!==_pinNewBuf){document.getElementById('pin-err').textContent='PIN tidak cocok';_pinBuf='';updatePinDots();return;}
    pins[_pinTarget]=hashPin(_pinBuf);savePins(pins);
    document.getElementById('pin-overlay').style.display='none';_pinBuf='';_pinNewBuf='';
    toast('PIN berhasil diubah');if(_pinCb)_pinCb(true);return;
  }
  // mode check
  if(!pins[_pinTarget]){document.getElementById('pin-overlay').style.display='none';_pinBuf='';if(_pinCb)_pinCb(true);return;}
  if(hashPin(_pinBuf)!==pins[_pinTarget]){document.getElementById('pin-err').textContent='PIN salah, coba lagi';_pinBuf='';updatePinDots();return;}
  document.getElementById('pin-overlay').style.display='none';_pinBuf='';if(_pinCb)_pinCb(true);
}

const RLBL = {
  pembina:'🎖 Pembina',pelatih:'🏃 Pelatih',
  aspelatih1:'👟 Asisten Pelatih 1',aspelatih2:'👟 Asisten Pelatih 2',
  ketua:'⭐ Ketua PPS',sekretaris:'📋 Sekretaris',
  bendahara:'💰 Bendahara',tatib:'⚖️ TATIB',
  pps26:'🫡 PPS Angkatan 26',pps25:'🏅 PPS Purna 25',
  purnasenior:'🎖 Purna Senior',balonpas:'🌱 Balonpas'
};

const ROLES_ALL = Object.keys(RLBL);
const SESI = ['Rabu Kumpul','Kamis Sore','Sabtu Latihan'];
const ASPEK = ['pb','fisik','mental','disiplin','kepemimpinan','komunikasi'];
const ASPEK_LBL = ['PBB','Fisik','Mental','Disiplin','Kepemimpinan','Komunikasi'];

function defD(){return{
  anggota:[],
  absensi:[],
  pelanggaran:[],
  proker:[],
  evaluasi:[],
  lomba:[],
  adat:[
    {id:'a1',kode:'A-01',jenis:'Hadir tidak tepat waktu',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a2',kode:'A-02',jenis:'Atribut/seragam latihan tidak lengkap',poin:1,tindakan:'Sanksi Ringan (PushUp 10x)'},
    {id:'a3',kode:'A-03',jenis:'Tidak mengucapkan salam/bersalaman saat datang & pulang',poin:1,tindakan:'Teguran lisan'},
    {id:'a4',kode:'A-04',jenis:'Tidak menghargai pembina, pelatih, senior, atau sesama',poin:5,tindakan:'Sanksi Berat (PushUp 50x dan Guling Botol)'},
    {id:'a5',kode:'A-05',jenis:'Menggunakan HP saat latihan tanpa izin',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a6',kode:'A-06',jenis:'Tidak menjaga kebersihan tempat latihan',poin:1,tindakan:'Sanksi Ringan (PushUp 10x)'},
    {id:'a7',kode:'A-07',jenis:'Berbicara saat pelatih memberikan instruksi',poin:2,tindakan:'Sanksi Sedang (PushUp 25x) atau mengulang instruksi di depan anggota'},
    {id:'a8',kode:'A-08',jenis:'Tidak menjaga sikap, tutur kata, dan etika',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a9',kode:'A-09',jenis:'Mengejek atau membully teman',poin:1,tindakan:'Sanksi Ringan (PushUp 10x) dan meminta maaf langsung'},
    {id:'a10',kode:'A-10',jenis:'Tidak menjaga kekompakan dan saling membantu',poin:1,tindakan:'Sanksi Ringan (PushUp 10x)'},
    {id:'a11',kode:'A-11',jenis:'Rambut/penampilan tidak rapi',poin:1,tindakan:'Sanksi Ringan (PushUp 10x) dan teguran'},
    {id:'a12',kode:'A-12',jenis:'Meninggalkan barisan tanpa izin',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a13',kode:'A-13',jenis:'Merusak atau tidak menjaga perlengkapan PASKIBRA',poin:5,tindakan:'Sanksi Berat (PushUp 50x dan Guling Botol) dan ganti perlengkapan'},
    {id:'a14',kode:'A-14',jenis:'Tidak menyelesaikan tugas yang diberikan',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a15',kode:'A-15',jenis:'Mencemarkan nama baik PASKIBRA MANSABEL',poin:5,tindakan:'Sanksi Berat (PushUp 50x dan Guling Botol), surat pernyataan, pembinaan bersama pembina'},
    {id:'a16',kode:'A-16',jenis:'Tidak izin saat berhalangan hadir (H-1)',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a17',kode:'A-17',jenis:'Berpacaran saat kegiatan PASKIB',poin:5,tindakan:'Sanksi Berat (PushUp 50x dan Guling Botol)'},
    {id:'a18',kode:'A-18',jenis:'Tidak mengikuti apel pembukaan/penutupan',poin:1,tindakan:'Sanksi Ringan (PushUp 10x)'},
    {id:'a19',kode:'A-19',jenis:'Minum minuman dingin sebelum menjadi PPS',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a20',kode:'A-20',jenis:'Tidak mengutamakan waktu ibadah',poin:5,tindakan:'Sanksi Berat (PushUp 50x dan Guling Botol)'},
    {id:'a21',kode:'A-21',jenis:'Tidak disiplin dalam pengaturan waktu kegiatan',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a22',kode:'A-22',jenis:'Tidak menggunakan helm saat berkendara',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
    {id:'a23',kode:'A-23',jenis:'Menyebarkan privasi kegiatan PASKIBRA',poin:10,tindakan:'Sanksi Berat (PushUp 50x dan Guling Botol) dan dikeluarkan secara tidak hormat'},
    {id:'a24',kode:'A-24',jenis:'Bermain kartu/game di luar agenda saat kegiatan berlangsung',poin:2,tindakan:'Sanksi Sedang (PushUp 25x)'},
  ],

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tgl(d){return new Date(d||Date.now()).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function toast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtRp(n){return'Rp '+Number(n).toLocaleString('id-ID')}
function skor(a){return Math.round((a.pb+a.fisik+a.mental+a.disiplin+a.kepemimpinan+a.komunikasi)/6*10)/10}
function levelPPI(s){
  if(s>=4.5)return['🏆 Potensi Nasional','ok'];
  if(s>=3.8)return['🥇 Potensi Provinsi','b'];
  if(s>=3.0)return['🥈 Potensi Kabupaten','g'];
  return['🔍 Perlu Pembinaan','w'];
}

function renderBeranda(){
  const el=document.getElementById('s-beranda');
  const unreadKom=D.komando.filter(k=>!k.dibaca).length;
  const unreadPng=D.pengumuman.filter(k=>!k.dibaca).length;

  let html='';

  // Komando Cepat (mendesak)
  const komList=D.komando.slice().reverse();
  if(komList.length){
    html+=`<div class="sec">⚡ KOMANDO CEPAT</div>`;
    komList.slice(0,3).forEach(k=>{
      html+=`<div class="komando-box"><h3>⚡ Komando dari ${esc(k.dari)}</h3><p>${esc(k.pesan)}</p><div class="kmeta">${tgl(k.tgl)} ${unreadKom?'<span class="badge badge-warn">Baru</span>':''}</div></div>`;
      if(!k.dibaca){k.dibaca=true;}
    });
    save();
  }

  // Pengumuman
  const pngList=D.pengumuman.slice().reverse();
  if(pngList.length){
    html+=`<div class="sec">📢 PENGUMUMAN</div>`;
    pngList.slice(0,3).forEach(p=>{
      html+=`<div class="pengumuman-box"><h3>📢 Dari ${esc(p.dari)}</h3><p style="font-size:14px">${esc(p.pesan)}</p><div style="font-size:11px;opacity:.7;margin-top:6px">${tgl(p.tgl)}</div></div>`;
      if(!p.dibaca){p.dibaca=true;}
    });
    save();
  }

  // Stats
  const totalAnggota=D.anggota.length;
  const totalBalonpas=D.anggota.filter(a=>a.role==='balonpas').length;
  const totalPPS=D.anggota.filter(a=>['pps26','pps25','purnasenior'].includes(a.role)).length;
  html+=`<div class="sec">📊 RINGKASAN</div>
  <div class="stats-row">
    <div class="stat-box"><div class="n" style="color:var(--accent2)">${totalAnggota}</div><div class="l">Total Anggota</div></div>
    <div class="stat-box"><div class="n" style="color:var(--ok)">${totalPPS}</div><div class="l">PPS Aktif</div></div>
    <div class="stat-box"><div class="n" style="color:var(--gold)">${totalBalonpas}</div><div class="l">Balonpas</div></div>
  </div>`;

  // Rekap perlu ditindak
  const melebihi=getAnggotaMelebihi();
  if(melebihi.length){
    html+=`<div class="alert alert-danger">⚠️ ${melebihi.length} anggota telah melewati batas — perlu ditindak!</div>`;
  }

  // Form kirim komando (Pembina/Pelatih jika diizinkan)
  if(C.komando_kirim(R)){
    html+=`<div class="sec">⚡ KIRIM KOMANDO CEPAT</div>
    <div class="card">
      <div class="field"><label>Pesan Komando</label><textarea id="inp-kom" placeholder="Tulis perintah mendesak..."></textarea></div>
      <button class="btn btn-primary btn-full" onclick="kirimKomando()">⚡ Kirim Komando</button>
    </div>`;
  }

  // Form kirim pengumuman
  if(C.pengumuman_kirim(R)){
    html+=`<div class="sec">📢 BUAT PENGUMUMAN</div>
    <div class="card">
      <div class="field"><label>Isi Pengumuman</label><textarea id="inp-png" placeholder="Tulis pengumuman biasa..."></textarea></div>
      <button class="btn btn-blue btn-full" onclick="kirimPengumuman()">📢 Kirim Pengumuman</button>
    </div>`;
  }

  // Izin pending (untuk pembina/pelatih)
  if(C.proker_acc(R)){
    const pendingIzin=D.izin.filter(i=>i.status==='pending');
    if(pendingIzin.length){
      html+=`<div class="alert alert-warn">📋 ${pendingIzin.length} pengajuan izin menunggu persetujuan</div>`;
    }
  }

  el.innerHTML=html;
}

function kirimKomando(){

  document.getElementById('inp-kom').value='';

function kirimPengumuman(){
  const v=document.getElementById('inp-png')?.value.trim();

function downloadTemplateCSV(){
  const header='nama,kelas,role,jabatan,hp,status';
  const contoh=[
    'Ahmad Fauzi,XI IPA 1,pps26,Anggota,08123456789,aktif',
    'Siti Rahmah,XI IPS 2,pps26,Wakil Ketua,08234567890,aktif',
    'Budi Santoso,X IPA 1,balonpas,Calon PPS,08345678901,aktif',
    '','# KETERANGAN KOLOM ROLE:',
    '# pps26       = PPS Angkatan 26 (anggota aktif)',
    '# pps25       = PPS Purna Angkatan 25',
    '# purnasenior = Purna Senior',
    '# balonpas    = Balonpas (calon anggota)',
    '# STATUS: aktif / purna / nonaktif',
  ];
  const csv=[header,...contoh].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='template_anggota_pramansabel.csv';a.click();
  URL.revokeObjectURL(url);
}

function importCSV(inp){
  const file=inp.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
    if(!lines.length)return toast('File CSV kosong');
    const header=lines[0].toLowerCase().split(',').map(h=>h.trim());
    const iNama=header.indexOf('nama');
    const iKelas=header.indexOf('kelas');
    const iRole=header.indexOf('role');
    const iJabatan=header.indexOf('jabatan');
    const iHp=header.indexOf('hp');
    const iStatus=header.indexOf('status');
    if(iNama<0||iRole<0)return toast('Kolom "nama" dan "role" wajib ada di CSV');
    const validRoles=['pps26','pps25','purnasenior','balonpas'];
    let added=0,skip=0;
    lines.slice(1).forEach(line=>{
      if(!line.trim()||line.startsWith('#'))return;
      const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      const nama=cols[iNama]||'';
      const role=cols[iRole]||'balonpas';
      if(!nama){skip++;return;}
      if(!validRoles.includes(role)){skip++;return;}
      if(D.anggota.find(a=>a.nama.toLowerCase()===nama.toLowerCase())){skip++;return;}
      D.anggota.push({
        id:uid(),nama,
        kelas:iKelas>=0?cols[iKelas]||'':'' ,
        role,
        jabatan:iJabatan>=0?cols[iJabatan]||'':'',
        hp:iHp>=0?cols[iHp]||'':'',
        status:iStatus>=0&&cols[iStatus]?cols[iStatus]:'aktif',
        tglDaftar:Date.now()
      });
      added++;
    });
    save();
    inp.value='';
    toast(`✅ ${added} anggota berhasil diimport${skip?' ('+skip+' dilewati)':''}`);
    tabAnggota('daftar',null);
    document.querySelectorAll('#s-anggota .tab')[0].classList.add('on');
  };
  reader.readAsText(file);
}

function setAbsensi(aid,si,tgl,status){
  let rec=D.absensi.find(x=>x.anggotaId===aid&&x.sesi===si&&x.tgl===tgl);
  if(rec) rec.status=status;
  else D.absensi.push({id:uid(),anggotaId:aid,sesi:si,tgl,status});
  // hitung alfa
  const a=D.anggota.find(x=>x.id===aid);
  if(a){
    a.totalAlfa=D.absensi.filter(x=>x.anggotaId===aid&&x.status==='alfa').length;
    a.totalIzin=D.absensi.filter(x=>x.anggotaId===aid&&x.status==='izin').length;
  }
  save();toast('Absensi disimpan');
}

function getAnggotaMelebihi(){
  return D.anggota.filter(a=>a.totalAlfa>=3);
}

function renderRekapAnggota(){
  const melebihi=getAnggotaMelebihi();

  if(!melebihi.length) html+='<div class="alert alert-ok">✅ Semua anggota masih dalam batas toleransi.</div>';

  });

// TTD pada proker
function ttdProker(pid){
  if(!D.ttd){
    openModal(`<div class="modal-title">Tanda Tangan Digital <button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:13px;color:var(--fg2);margin-bottom:12px">Anda belum memiliki tanda tangan tersimpan. Buat sekarang:</p>
    <canvas id="ttd-canvas" width="400" height="160"></canvas>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="clearTTD()">🗑 Hapus</button>
      <button class="btn btn-primary btn-sm btn-full" onclick="saveTTD('${pid}')">💾 Simpan & Tanda Tangani</button>
    </div>`);
    initTTDCanvas();
  } else {
    // TTD sudah ada, langsung tempel
    embedTTD(pid);
  }
}
let ttdCtx,ttdDrawing=false,ttdPts=[];
function initTTDCanvas(){
  const c=document.getElementById('ttd-canvas');if(!c)return;
  ttdCtx=c.getContext('2d');
  ttdCtx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#000';
  ttdCtx.lineWidth=2;ttdCtx.lineCap='round';
  c.addEventListener('mousedown',e=>{ttdDrawing=true;ttdCtx.beginPath();ttdCtx.moveTo(e.offsetX,e.offsetY);});
  c.addEventListener('mousemove',e=>{if(!ttdDrawing)return;ttdCtx.lineTo(e.offsetX,e.offsetY);ttdCtx.stroke();});
  c.addEventListener('mouseup',()=>ttdDrawing=false);
  c.addEventListener('touchstart',e=>{e.preventDefault();ttdDrawing=true;const r=c.getBoundingClientRect();const t=e.touches[0];ttdCtx.beginPath();ttdCtx.moveTo(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(!ttdDrawing)return;const r=c.getBoundingClientRect();const t=e.touches[0];ttdCtx.lineTo(t.clientX-r.left,t.clientY-r.top);ttdCtx.stroke();},{passive:false});
  c.addEventListener('touchend',()=>ttdDrawing=false);
}
function clearTTD(){const c=document.getElementById('ttd-canvas');if(c){ttdCtx.clearRect(0,0,c.width,c.height);}}
function saveTTD(pid){
  const c=document.getElementById('ttd-canvas');if(!c)return;
  D.ttd=c.toDataURL();save();closeModal();toast('TTD disimpan');
  if(pid) embedTTD(pid);
}
function embedTTD(pid){
  const p=D.proker.find(x=>x.id===pid);if(!p)return;
  p.ttd=D.ttd;p.ttdOleh=RLBL[R];p.ttdTgl=Date.now();
  save();toast('Dokumen berhasil ditandatangani');renderTabKegiatan('proker');
}

function copyWA(teks){
  try{
    navigator.clipboard.writeText(teks).then(()=>toast('Disalin ke clipboard! Paste ke WA grup')).catch(()=>{selectTeks(teks);});
  }catch(e){toast('Salin manual dari text di bawah');}
}
function selectTeks(teks){
  const ta=document.createElement('textarea');ta.value=teks;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Disalin!');
}
function shareWA(teks){
  if(navigator.share){navigator.share({text:teks}).catch(()=>copyWA(teks));}
  else copyWA(teks);
}

function renderRekapPembina(){
  const now=Date.now();
  const bln=new Date().getMonth();const thn=new Date().getFullYear();
  // Hitung data
  const anggotaAktif=D.anggota.filter(a=>a.status==='aktif');
  const pps=anggotaAktif.filter(a=>['pps26','pps25','purnasenior'].includes(a.role));
  const balonpas=anggotaAktif.filter(a=>a.role==='balonpas');
  // Absensi bulan ini
  const absBln=D.absensi.filter(a=>{const d=new Date(a.tgl);return d.getMonth()===bln&&d.getFullYear()===thn;});
  const totalSesi=absBln.length;
  const rataHadir=totalSesi?Math.round(absBln.reduce((s,a)=>{const h=Object.values(a.data||{}).filter(v=>v==='H').length;const t=Object.values(a.data||{}).length;return s+(t?h/t:0);},0)/totalSesi*100):0;
  // Pelanggaran bulan ini
  const pelBln=D.pelanggaran.filter(p=>{const d=new Date(p.tgl);return d.getMonth()===bln&&d.getFullYear()===thn;});
  const pelResmi=pelBln.filter(p=>p.status!=='aduan');
  const aduanPending=D.pelanggaran.filter(p=>p.status==='aduan');
  // Keuangan
  const masuk=D.keuangan.filter(k=>k.jenis==='masuk').reduce((s,k)=>s+k.jumlah,0);
  const keluar=D.keuangan.filter(k=>k.jenis==='keluar').reduce((s,k)=>s+k.jumlah,0);
  const saldo=masuk-keluar;
  // Proker
  const prokerAktif=D.proker.filter(p=>p.status==='disetujui').length;
  const prokerPending=D.proker.filter(p=>p.status==='pending').length;
  // Pemetaan
  const pemetaanList=D.pemetaan||[];
  const topAnggota=pemetaanList.filter(p=>p.scores&&Object.keys(p.scores).length)
    .map(p=>{const ss=Object.values(p.scores);const avg=ss.reduce((a,s)=>a+(s.pb+s.fisik+s.mental+s.disiplin+s.kepemimpinan+s.komunikasi)/6,0)/ss.length;return{nama:p.nama,avg:Math.round(avg*10)/10};})
    .sort((a,b)=>b.avg-a.avg).slice(0,5);
  // Anggota perlu perhatian
  const perluPerhatian=anggotaAktif.map(a=>{
    const totPoin=D.pelanggaran.filter(p=>p.nama===a.nama&&p.status!=='aduan').reduce((s,p)=>s+p.poin,0);
    return{...a,poin:totPoin};
  }).filter(a=>a.poin>=5).sort((a,b)=>b.poin-a.poin);

  return `<div style="padding:4px 0">
    <div class="sec">📊 RINGKASAN KONDISI TERKINI</div>
    <div class="stats-row" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat-box"><div class="n" style="color:var(--accent2)">${anggotaAktif.length}</div><div class="l">Total Aktif</div></div>
      <div class="stat-box"><div class="n" style="color:var(--ok)">${pps.length}</div><div class="l">PPS</div></div>
      <div class="stat-box"><div class="n" style="color:var(--gold)">${balonpas.length}</div><div class="l">Balonpas</div></div>
      <div class="stat-box"><div class="n" style="color:var(--warn)">${aduanPending.length}</div><div class="l">Aduan Pending</div></div>
    </div>

    <div class="sec">📅 KEHADIRAN BULAN INI</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:14px;font-weight:600">${totalSesi} Sesi Latihan</span>
        <span class="badge ${rataHadir>=80?'badge-ok':rataHadir>=60?'badge-warn':'badge-danger'}">${rataHadir}% Rata Hadir</span>
      </div>
      <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden">
        <div style="background:${rataHadir>=80?'var(--ok)':rataHadir>=60?'var(--warn)':'var(--danger)'};height:100%;width:${rataHadir}%;transition:.5s"></div>
      </div>
      ${absBln.length?`<div style="margin-top:12px">${absBln.slice(-3).reverse().map(a=>{
        const h=Object.values(a.data||{}).filter(v=>v==='H').length;

  let html=`<div class="stats-row" style="grid-template-columns:repeat(2,1fr)">

    html+=`<div class="kas-item"><div><div style="font-weight:600;font-size:14px">${esc(k.ket)}</div><div style="font-size:11px;color:var(--fg2)">${tgl(k.tgl)}</div></div><div style="font-weight:700;color:${k.jenis==='masuk'?'var(--ok)':'var(--danger)'}">${k.jenis==='masuk'?'+':'-'}${fmtRp(k.nominal)}</div></div>`;

function catatKas(){
  const ket=document.getElementById('ks-ket').value.trim();

  D.kas.push({id:uid(),tgl:Date.now(),ket,nominal:nom,jenis:document.getElementById('ks-jenis').value});
  save();toast('Transaksi dicatat');renderTabLaporan('keuangan');
}

    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:600;font-size:13px">${RLBL[role]||role}</div>
        <div style="font-size:11px;color:${aktif?'var(--ok)':'var(--fg3)'}">
          ${aktif?'🔒 PIN aktif':'🔓 Belum ada PIN'}
        </div>
      </div>
      <div style="display:flex;gap:6px">
        ${aktif
          ?`<button onclick="openPinModal('${role}','change',()=>renderTabPengaturan('config'))" style="background:var(--accent2);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">Ubah</button>
             <button onclick="hapusPinRole('${role}')" style="background:var(--danger);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">Hapus</button>`
          :`<button onclick="openPinModal('${role}','set',()=>renderTabPengaturan('config'))" style="background:var(--ok);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">Set PIN</button>`
        }
      </div>
    </div>`;
  }).join('');
  return`<div class="card" style="margin-bottom:12px">
    <div class="card-title">Konfigurasi Sistem</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
      <div><div style="font-weight:600;font-size:14px">Izinkan Pelatih Kirim Komando</div><div style="font-size:12px;color:var(--fg2)">Pelatih dapat memberi komando cepat</div></div>
      <label style="position:relative;width:44px;height:24px">
        <input type="checkbox" id="cfg-pelatih-komando" ${D.config.pelatih_komando?'checked':''} onchange="toggleConfig('pelatih_komando',this.checked)" style="opacity:0;width:0;height:0">
        <span style="position:absolute;inset:0;border-radius:12px;background:${D.config.pelatih_komando?'var(--ok)':'var(--border)'};cursor:pointer;transition:.3s">
          <span style="position:absolute;top:3px;left:${D.config.pelatih_komando?'22px':'3px'};width:18px;height:18px;border-radius:50%;background:#fff;transition:.3s"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🔐 Manajemen PIN Role</div>
    <p style="font-size:12px;color:var(--fg2);margin-bottom:8px">Set PIN 4 digit untuk mengamankan akses role sensitif. Hanya Pembina yang bisa mengatur PIN.</p>
    ${pinRows}
  </div>`;
}
function hapusPinRole(role){
  const p=getPins();delete p[role];savePins(p);
  toast('PIN '+RLBL[role]+' dihapus');renderTabPengaturan('config');
}
function toggleConfig(key,val){
  D.config[key]=val;save();toast(`Konfigurasi ${val?'diaktifkan':'dinonaktifkan'}`);renderTabPengaturan('config');
}
function resetData(){
  if(!confirm('Reset semua data? Tindakan ini tidak dapat dibatalkan!'))return;
  D=defD();save();toast('Data direset');renderBeranda();
}

// Init
</script>
<!-- PIN MODAL -->
<div id="pin-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:320px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)">
    <div style="font-size:13px;font-weight:700;color:var(--fg2);margin-bottom:4px">🔐 PIN Role</div>
    <div id="pin-role-label" style="font-size:18px;font-weight:900;font-family:'Exo 2',sans-serif;color:var(--accent);margin-bottom:8px"></div>
    <div id="pin-desc" style="font-size:12px;color:var(--fg2);margin-bottom:16px"></div>
    <div id="pin-dots" style="display:flex;justify-content:center;gap:12px;margin-bottom:8px">
      <span class="pd"></span><span class="pd"></span><span class="pd"></span><span class="pd"></span>
    </div>
    <div id="pin-err" style="font-size:12px;color:var(--danger);min-height:18px;margin-bottom:12px"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">
      <button onclick="pinKey('1')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">1</button>
      <button onclick="pinKey('2')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">2</button>
      <button onclick="pinKey('3')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">3</button>
      <button onclick="pinKey('4')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">4</button>
      <button onclick="pinKey('5')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">5</button>
      <button onclick="pinKey('6')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">6</button>
      <button onclick="pinKey('7')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">7</button>
      <button onclick="pinKey('8')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">8</button>
      <button onclick="pinKey('9')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">9</button>
      <button onclick="pinKey('←')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">←</button>
      <button onclick="pinKey('0')" style="padding:14px;font-size:18px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--fg)">0</button>
      <button onclick="pinKey('✓')" style="padding:14px;font-size:18px;font-weight:700;background:var(--ok);border:none;border-radius:10px;cursor:pointer;color:#fff">✓</button>
    </div>
    <button onclick="cancelPin()" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--fg2);cursor:pointer;margin-top:4px">Batal</button>
  </div>
</div>
<style>.pd{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:.2s}.pd.filled{background:var(--accent);border-color:var(--accent)}</style>

<div id="footer-cr" style="text-align:center;padding:16px;font-size:11px;color:var(--fg3);margin-top:8px;border-top:1px solid var(--border)">

</div>
